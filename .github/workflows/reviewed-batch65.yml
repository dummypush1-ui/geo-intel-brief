{
  "name": "Reviewed private increment batch65",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed offline article writer",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/geo_article_writer.py', 'integration/GEO_ARTICLE_WRITER_LIMITS.md', 'tests/test_geo_article_writer.py', 'staging-manifest.json', 'README.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/geo_article_writer.py': '28379724081b15a961f30ac4bbbb7711aac8058b2b956392a77bbe960ebb54dd', 'integration/GEO_ARTICLE_WRITER_LIMITS.md': '1de66dab3c2ce5c4e0695637197d1c755810c4b3ad3ff12fde6999e82d6fdf48', 'tests/test_geo_article_writer.py': 'cd596802291b4bf2243fc1101cb21a12c8029c4b93189e92554b756bb2278fdc', 'README.md': 'e5d9f0d58f90ac8c6bf55e05e543e746bfe7cd01514721d9afd4647b0c8d2eb5', 'staging-manifest.json': '610ba112b68f9b794386c50594d3e26c363759314d9a53fd44efe5e07941464d'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/geo_article_writer.py integration/GEO_ARTICLE_WRITER_LIMITS.md tests/test_geo_article_writer.py README.md staging-manifest.json\ngit commit -m 'Save reviewed Geo injected article writer'\ngit push\nrm .github/workflows/reviewed-batch65.yml\ngit add .github/workflows/reviewed-batch65.yml\ngit commit -m 'Retire batch65 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
