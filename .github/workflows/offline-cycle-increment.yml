name: Private offline collection cycle
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='6304c36f682f4b2582523d6fa9424cb1f2b58695a4cfffc7d8b79a87d95cf20d'\n\
        allowed={'staging-manifest.json', 'integration/fake_collection_writer.py',\
        \ 'integration/OFFLINE_CYCLE_LIMITS.md', 'integration/offline_collection_cycle.py',\
        \ 'tests/test_offline_collection_cycle.py'}\nwith zipfile.ZipFile(io.BytesIO(data))\
        \ as z:\n    assert set(z.namelist())==allowed and not z.testzip()\n    z.extractall('.')\n\
        PY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/offline-cycle-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Add offline supplied-candidate fake collection cycle''

        git push

        '
