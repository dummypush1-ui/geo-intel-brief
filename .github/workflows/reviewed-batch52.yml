{
  "name": "Reviewed private increment batch52",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed trusted-source Apps Script offline audit",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='4651e0036feab29780bee6629776c2f20c70bae0ccd287c279e44e9fe3213451'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'tests/test_apps_script_audit.py', 'staging-manifest.json', 'integration/apps_script_audit/audit.js', 'integration/apps_script_audit/README.md', 'integration/apps_script_audit/labeled_run.py', 'integration/EXPORT_DIGEST_LIMITS.md', 'integration/FINDER_PARITY_PLAN.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/apps_script_audit/audit.js': 'c45451120b211d1dee387d0e9922522fa58008fb6e5e0ca73095ca910db1aac5', 'integration/apps_script_audit/README.md': 'fe4abd3058d0ee1d3655d7ddabdb36205c276075c28350fbe63fd1abf1712225', 'integration/apps_script_audit/labeled_run.py': '10688b7be0964a5f5ff36c0392c3d4aaad0e80127168a01b1642a207eacaf40d', 'tests/test_apps_script_audit.py': '0d5d90ddf002870c80e3ef59da25590e310c67aa883a4b12eebd392a655b2c42', 'integration/FINDER_PARITY_PLAN.md': '373a9a8902e639db1f6e6d1116753606a150873e75c1b00a1c9b7b2685c447c9', 'integration/EXPORT_DIGEST_LIMITS.md': '95f9029499f75d2138ebe320ddb1accd7ad7690799dacaee9feb2d5b0b02bc1c', 'staging-manifest.json': 'dd4c349620ab671b7b560173be042fdf6d97a6a3d36535d04bfd1152682d9d57'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/apps_script_audit/audit.js integration/apps_script_audit/README.md integration/apps_script_audit/labeled_run.py tests/test_apps_script_audit.py integration/FINDER_PARITY_PLAN.md integration/EXPORT_DIGEST_LIMITS.md staging-manifest.json\ngit commit -m 'Save reviewed trusted-source Apps Script offline audit'\ngit push\nrm .github/workflows/reviewed-batch52.yml\ngit add .github/workflows/reviewed-batch52.yml\ngit commit -m 'Retire batch52 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
