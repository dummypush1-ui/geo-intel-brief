    - name: Full private fixture tests
      run: 'pip install -r requirements-staging.txt

        python -m unittest discover -s tests -v

        node --input-type=module --check < integration/ui/workspace.js

        '
    - name: Commit backup and retire workflow
      run: 'rm .github/workflows/preview-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Add guarded private preview and read-only runtime''

        git push

        '
