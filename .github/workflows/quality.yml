name: quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finder-build-and-node-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Build Finder outputs from reviewed source
        run: npm run build
      - name: Validate repository audit helper
        run: |
          python3 -m py_compile scripts/repo_audit.py
          python3 scripts/repo_audit.py > /tmp/repository-audit.md
          grep -q "Exact-content duplicate groups" /tmp/repository-audit.md
