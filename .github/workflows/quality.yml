name: quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finder-build-and-node-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Build Finder outputs from reviewed source
        run: npm run build
      - name: Run standalone Node regression tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "::group::node $file"
            node "$file"
            echo "::endgroup::"
          done < <(find tests -type f -name '*.mjs' -print | sort)
  python-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-future-deploy.lock
            requirements-staging.txt
      - name: Install hash-locked regression dependencies
        run: python -m pip install --require-hashes -r requirements-future-deploy.lock
      - name: Install pinned staging application dependencies
        run: python -m pip install -r requirements-staging.txt
      - name: Install browser and Linux isolation test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap poppler-utils
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo ln -sf "$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" /usr/bin/google-chrome
          sudo ln -sf "$(command -v node)" /usr/bin/node
      - name: Run repository regression suite
        env:
          PYTHONPATH: .:tests
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Run production entry and preservation checks
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s checks -v
