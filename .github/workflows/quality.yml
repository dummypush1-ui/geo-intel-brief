name: quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finder-build-and-runtime-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build Finder outputs from reviewed source
        run: npm run build
      - name: Check production Node entry points
        run: |
          node --check server.js
          node --check proxy.js
          node --check refresh.mjs
          node --check build.mjs
          node --check updater_runtime/public-status.cjs
          node --check proxy_runtime/cors-policy.cjs
      - name: Verify generated Finder outputs exist
        run: |
          test -s index.html
          test -s offline.html
          test -s sw.js
          test -n "$(find . -maxdepth 1 -type f -name 'data.[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f].js' -print -quit)"
