name: quality
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finder-build-and-node-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build Finder outputs from reviewed source
        run: npm run build
      - name: Test generated Finder build contracts
        run: python3 tests/test_finder_build_contract.py
      - name: Validate repository audit helper
        run: |
          python3 -m py_compile scripts/repo_audit.py
          python3 scripts/repo_audit.py > /tmp/repository-audit.md
          grep -q "Exact-content duplicate groups" /tmp/repository-audit.md

  python-entry-and-public-read-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned runtime dependencies for contract tests
        run: |
          python -m pip install --disable-pip-version-check \
            Flask==3.1.3 \
            Werkzeug==3.1.9 \
            PyYAML==6.0.2 \
            feedparser==6.0.11 \
            requests==2.34.2 \
            python-dotenv==1.2.4 \
            schedule==1.2.2 \
            gunicorn==26.2.0 \
            pymongo==4.18.2
      - name: Compile production Python source trees
        run: python -m compileall -q production_entry.py integration intelligence feature_mail_mount proxy_runtime updater_runtime
      - name: Test production entry default-off contracts
        run: python tests/test_production_entry_contract.py
      - name: Test public live builder read-only contracts
        run: python tests/test_public_live_builder_contract.py
