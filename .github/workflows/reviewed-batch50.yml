{
  "name": "Reviewed private increment batch50",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed supplied Geo queue renderer contract",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='ba5f2eb3b0d4f1aefe049cb337d3eb4c4ffecc606447b894dc02bb97e0ae5c0a'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/geo_queue_fixture.py', 'staging-manifest.json', 'tests/test_geo_queue_fixture.py', 'integration/GEO_QUEUE_LIMITS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/geo_queue_fixture.py': 'c3be7feaa65f7d2352709c1a6b091672659ccf233d424ad4f75e9205ef49ab81', 'integration/GEO_QUEUE_LIMITS.md': '3b51b3246bfff820d49f478c2e5b3fe5d6e33422d31b1aaa796eb799ec3f0609', 'tests/test_geo_queue_fixture.py': '5d4ab0ed44621d50137b98f89b4bc3711f6c5de05504243aded75d17a30d2a3d', 'staging-manifest.json': '06af273b12199a02df058d185b1679366380657ff750958f709d13ef0e9cc05d'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/geo_queue_fixture.py integration/GEO_QUEUE_LIMITS.md tests/test_geo_queue_fixture.py staging-manifest.json\ngit commit -m 'Save reviewed supplied Geo queue renderer contract'\ngit push\nrm .github/workflows/reviewed-batch50.yml\ngit add .github/workflows/reviewed-batch50.yml\ngit commit -m 'Retire batch50 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
