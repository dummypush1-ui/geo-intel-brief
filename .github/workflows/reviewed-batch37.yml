{
  "name": "Reviewed account UI batch37",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply reviewed private account UI",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='417370919c3eed266c75c351bcbc85cbc42dc311f4641c4ec5d7bd492a2145f9'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'tests/accounts/test_http_fixture.py', 'tests/accounts/browser_http_fixture.py', 'staging-manifest.json', 'integration/accounts/http_fixture.py', 'integration/accounts/ui/account.css', 'integration/accounts/ui/account.html', 'integration/accounts/ui/account.js'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/accounts/http_fixture.py': '0e41c2cedee4d4a92f06b9eecfd947f9da1c9c40265e8d05d11d23bf13463aa0', 'integration/accounts/ui/account.html': '79969a901bc356378562a0834a5ccdba4d7b30bed3130ab079aa797992495e6d', 'integration/accounts/ui/account.css': '6236fa318f85cbb358a7ef8bd1847131b0455c790e11f84498980ff64f11e404', 'integration/accounts/ui/account.js': '0831daee94aa9ef66c4abcfba2d2fb7d0ad1ce03e8410d4b11eb9f357afc3a2e', 'tests/accounts/test_http_fixture.py': '3a210c397ef54d3f80424d2646be199ffb8424b9cbc071bc160be3ea3891cd40', 'tests/accounts/browser_http_fixture.py': '73055044391049441a8fe6b16b63e1e7ffead68121630d0f16fe5c3bcd930947', 'staging-manifest.json': '05986151555b2b20c47ca2fe28855b606a3a3c2adcc2a2f9819b7bd5b47f56c4'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/accounts/http_fixture.py integration/accounts/ui/account.html integration/accounts/ui/account.css integration/accounts/ui/account.js tests/accounts/test_http_fixture.py tests/accounts/browser_http_fixture.py staging-manifest.json\ngit commit -m 'Add reviewed memory-only account preview UI'\ngit push\nrm .github/workflows/reviewed-batch37.yml\ngit add .github/workflows/reviewed-batch37.yml\ngit commit -m 'Retire batch37 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
