{
  "name": "Reviewed private increment batch41",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Fix reviewed nested Finder shortlist scrolling",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='9e52f1b4b9645366eb9d3be4a72abe1f6332f2ee1faae26db8d94d94bd420516'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/news_api.py', 'tests/browser_finder_nested.py', 'tests/test_finder_nested.py', 'staging-manifest.json', 'integration/FINDER_NESTED_LIMITS.md', 'integration/finder_nested.py'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/finder_nested.py': 'd81ccdd05d21b280be66fb1215143302d8356af79a2cbeac926baea80192d886', 'integration/news_api.py': '4217871952620914c8ec1d8c1e4167c3839b3adf886f1b9c70b6b200e7282a24', 'integration/FINDER_NESTED_LIMITS.md': '4c2a8a7452e6a60ace834b31d6416eb06457933e3d39e981a74e51d14c9c3ca7', 'tests/test_finder_nested.py': '5aeeda7c2b200b03bca7569a34398af9811753dbb71bbef641ffa9004128f7ab', 'tests/browser_finder_nested.py': 'de72d9c225b71e6909e9218a96c3dd273d108ca7bfbafa2abbfb8b3edfce4c83', 'staging-manifest.json': 'e12d85499074e9c35df7c892733270563447019aee964cb94132e441ca473e38'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/finder_nested.py integration/news_api.py integration/FINDER_NESTED_LIMITS.md tests/test_finder_nested.py tests/browser_finder_nested.py staging-manifest.json\ngit commit -m 'Fix reviewed nested Finder shortlist scrolling'\ngit push\nrm .github/workflows/reviewed-batch41.yml\ngit add .github/workflows/reviewed-batch41.yml\ngit commit -m 'Retire batch41 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
