{
  "name": "Reviewed account HTTP batch36",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply reviewed private HTTP fixture",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='4eb2a23045a847535923991b79395f1ac02217db4a97aba04d5e08b3314bd184'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/accounts/http_fixture.py', 'staging-manifest.json', 'tests/accounts/test_http_fixture.py', 'integration/accounts/HTTP_FIXTURE_LIMITS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/accounts/http_fixture.py': 'b18c8c14fc984b6d5ee639977dcc971955249481efcf4f38a93651868309fb90', 'integration/accounts/HTTP_FIXTURE_LIMITS.md': '8758bb26a4c3ae05af134f85f9d01e750a753e9d6c9997f411dae38f8e92f30a', 'tests/accounts/test_http_fixture.py': 'f2509eb5350fd97bae4aae5bd61568e6dd53afe8110947448a763fe6c18aefcb', 'staging-manifest.json': 'a0e30a70e8d9e406c6102f92f14a800e5e6bb514ad87119ec31246cb97fbfb10'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/accounts/http_fixture.py integration/accounts/HTTP_FIXTURE_LIMITS.md tests/accounts/test_http_fixture.py staging-manifest.json\ngit commit -m 'Add reviewed memory-only account HTTP fixture'\ngit push\nrm .github/workflows/reviewed-batch36.yml\ngit add .github/workflows/reviewed-batch36.yml\ngit commit -m 'Retire batch36 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
