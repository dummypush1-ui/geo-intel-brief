name: Private snapshot contract hardening
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='c7e66824e8a88cb9f8c349616ff2da3de5fb38f50e3379d5b7a954ebb7a11f4b'\n\
        allowed={'integration/news_api.py', 'tests/test_dashboard_snapshots.py', 'integration/dashboard_snapshots.py',\
        \ 'staging-manifest.json'}\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n\
        \    assert set(z.namelist())==allowed and not z.testzip()\n    z.extractall('.')\n\
        PY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/snapshot-contract-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Harden snapshot adapter links and deterministic ordering''

        git push

        '
