name: Private captured dashboard snapshot UI
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='cbe1d6c2deece1c9bcd0dec733e5d1e275108f59a2238cbe9a85c51bb66b0ec9'\n\
        allowed={'integration/ui/workspace.html', 'integration/ui/workspace.js', 'integration/ui/workspace.css',\
        \ 'staging-manifest.json', 'tests/browser_dashboard_snapshots.py', 'tests/__init__.py'}\n\
        with zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert set(z.namelist())==allowed\
        \ and not z.testzip()\n    z.extractall('.')\nPY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/snapshot-ui-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Add captured dashboard snapshot panels''

        git push

        '
