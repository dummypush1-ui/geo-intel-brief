        run: |
          rm .github/workflows/workspace-increment.yml
          git config user.name 'geo-intel-staging-bot'
          git config user.email 'staging@users.noreply.github.com'
          git add -A
          git commit -m 'Add private staging workspace and read-only tested adapters'
          git push
