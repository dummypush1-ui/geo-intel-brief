{
  "name": "Reviewed private increment batch72",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed offline increment 72",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'tests/accounts/test_merged_fixture.py', 'integration/accounts/MERGED_FIXTURE_LIMITS.md', 'staging-manifest.json', 'integration/accounts/merged_fixture.py', 'integration/FEATURE_STATUS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/accounts/merged_fixture.py': '31c8e57628ccda84e852a09affb6e21888a18c260a0b74b34b51b0d7d215ffc7', 'integration/accounts/MERGED_FIXTURE_LIMITS.md': 'cd79cdec80e64bb132fd0a9ddc4f19e41d3a3311c789a9d409e39fed659d9f83', 'tests/accounts/test_merged_fixture.py': '43bbc4d8169ef9c716b6b4d6cd83d8c8deb7231817db24e4d55b8303c622cac9', 'integration/FEATURE_STATUS.md': 'c4a36d2bb5c1ee4c6fb5cad11d35b345d21e21c4ae22def76ebccb443ac4fa4e', 'staging-manifest.json': 'cccd63f06c2b675babdde43c0a7f0861d54902e9ba2f00cfd78991e758454e85'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/accounts/merged_fixture.py integration/accounts/MERGED_FIXTURE_LIMITS.md tests/accounts/test_merged_fixture.py integration/FEATURE_STATUS.md staging-manifest.json\ngit commit -m 'Save reviewed offline increment 72'\ngit push\nrm .github/workflows/reviewed-batch72.yml\ngit add .github/workflows/reviewed-batch72.yml\ngit commit -m 'Retire batch72 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
