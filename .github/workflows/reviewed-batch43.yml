{
  "name": "Reviewed private increment batch43",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Port reviewed BRICS stream configuration parser",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='0bc38db88b36e3c483dcdae1d379feb9712a9e6d87b9967c2899ae0e5a587461'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'tests/test_stream_config.py', 'staging-manifest.json', 'integration/stream_config.py', 'integration/BRICS_STREAM_LIMITS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/stream_config.py': 'dc36e1f1310bc99fd2724d761b8fa068e1118b609ea8b2e2b0491bf025abeb4e', 'integration/BRICS_STREAM_LIMITS.md': 'e9363c3b3068378214e71d1e0d7a1b72d067263804e61839c88de4801b628b63', 'tests/test_stream_config.py': 'fe6edd2f32f29aee1a12a6ec044a27b9d511691e4399631304bfb2d53acf3c4f', 'staging-manifest.json': '76cab879359107a0fd63a7adf226a040ae6f17fb4c83c7c225369f6ceb9bfe09'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/stream_config.py integration/BRICS_STREAM_LIMITS.md tests/test_stream_config.py staging-manifest.json\ngit commit -m 'Port reviewed BRICS stream configuration parser'\ngit push\nrm .github/workflows/reviewed-batch43.yml\ngit add .github/workflows/reviewed-batch43.yml\ngit commit -m 'Retire batch43 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
