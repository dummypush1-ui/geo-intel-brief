{
  "name": "Reviewed private increment batch62",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed Geo events read composition",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/preview_launcher.py', '.env.example', 'integration/GEO_ONLY_LIMITS.md', 'integration/GEO_READ_FACTORY_LIMITS.md', 'integration/GEO_EVENTS_COMPOSITION_LIMITS.md', 'tests/test_geo_event_composition.py', 'staging-manifest.json', 'integration/geo_only_runtime.py'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/geo_only_runtime.py': '49cdb46fbffbf4b3cda0eb3598899585dcf2799228cb362a082bbc3b68d81834', 'integration/preview_launcher.py': 'a3db46d60c7348f25f7629ef36f784a1400b0eae9b8eb016f8563f79682a6f0d', 'integration/GEO_EVENTS_COMPOSITION_LIMITS.md': '7131804831955b0a9aa1a9311dcbbd6f1bcebf31ba91f934e4e430b5737da27c', 'integration/GEO_ONLY_LIMITS.md': 'c7987ba25cbb982a42c9131bd2dc902895eb37aff066b8972302430b412b64de', 'integration/GEO_READ_FACTORY_LIMITS.md': '51f161c7421d970ff4fd82cbacf3a595417d0d37a69d8433e5ee39eaa5006445', '.env.example': '5b55ea34232193b14ed821cecc9afa35f4d78e61e056d98da109cd7750c6ae56', 'tests/test_geo_event_composition.py': '6814a32a6de068f6a694c76126664d5f1143a5bc9e7e818a0270477036a62b89', 'staging-manifest.json': '9be9c62c4166fa2e98e63c11de8808b06fc8a74b4d1675666b3729745dbb1b24'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/geo_only_runtime.py integration/preview_launcher.py integration/GEO_EVENTS_COMPOSITION_LIMITS.md integration/GEO_ONLY_LIMITS.md integration/GEO_READ_FACTORY_LIMITS.md .env.example tests/test_geo_event_composition.py staging-manifest.json\ngit commit -m 'Save separately gated Geo events and original digest composition'\ngit push\nrm .github/workflows/reviewed-batch62.yml\ngit add .github/workflows/reviewed-batch62.yml\ngit commit -m 'Retire batch62 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
