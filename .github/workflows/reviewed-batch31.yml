{
  "name": "Private reviewed accounts and signal panel",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply reviewed private increment",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='11421abce5b3ce4e3677bb46fdfeb9be8fdaad4a8469531aca611590ad4d575e'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n assert set(z.namelist())=={'integration/COUNTRY_SIGNALS_LIMITS.md', 'integration/accounts/service.py', 'integration/accounts/passwords.py', 'integration/accounts/store.py', 'tests/accounts/test_accounts.py', 'integration/news_api.py', 'integration/accounts/csrf.py', 'staging-manifest.json', 'tests/accounts/test_hardening.py', 'integration/accounts/README.md', 'integration/accounts/validators.py', 'tests/test_country_signals_routes.py', 'integration/ui/countries.js', 'integration/accounts/settings.py', 'integration/ui/countries.html', 'tests/accounts/__init__.py', 'integration/accounts/__init__.py', 'integration/accounts/limiter.py'} and not z.testzip()\n z.extractall('.')\nPY\ngit add integration/accounts/README.md integration/accounts/__init__.py integration/accounts/csrf.py integration/accounts/limiter.py integration/accounts/passwords.py integration/accounts/service.py integration/accounts/settings.py integration/accounts/store.py integration/accounts/validators.py tests/accounts/__init__.py tests/accounts/test_accounts.py tests/accounts/test_hardening.py integration/news_api.py integration/ui/countries.js integration/ui/countries.html integration/COUNTRY_SIGNALS_LIMITS.md tests/test_country_signals_routes.py staging-manifest.json\ngit commit -m 'Add reviewed accounts foundation and private country signals panel'\ngit push\nrm .github/workflows/reviewed-batch31.yml\ngit add .github/workflows/reviewed-batch31.yml\ngit commit -m 'Retire batch31 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
