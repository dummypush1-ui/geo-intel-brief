name: Collector197e read-only diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.repository == 'dummypush1-ui/geo-intel-brief' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 08914ab7873387d127484075d9439fdc0377fbbf
          persist-credentials: false
      - name: Install bounded diagnostic dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo -n apt-get update
          sudo -n apt-get install -y bubblewrap
          python3 -m venv .collector-job-env
          .collector-job-env/bin/python -m pip install --require-hashes -r requirements-collector-cp312.lock
      - name: Runner facts (read only)
        shell: bash
        run: |
          uname -r
          cat /proc/self/cgroup
          echo "controllers: $(cat /sys/fs/cgroup/cgroup.controllers)"
          echo "subtree_control: $(cat /sys/fs/cgroup/cgroup.subtree_control)"
          free -m
      - name: Disposable aggregate guard diagnostics only (traced)
        shell: bash
        run: |
          set +e
          sudo -n /bin/bash -c '/usr/bin/env -i PATH=/usr/bin:/bin SUDO_UID="$SUDO_UID" SUDO_GID="$SUDO_GID" /bin/bash -x integration/collector197_job_diagnostic.sh --diagnose' > /tmp/diag.out 2>&1
          code=$?
          echo "diagnostic_exit_code=$code"
          tail -n 120 /tmp/diag.out
          exit 0
