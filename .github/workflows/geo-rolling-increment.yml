name: Private Geo rolling sample breakdown
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='7cac6d0d492844868c9a6416ae3b38a8ad03fc3f1f6326e2b322a8cdcf8a12ac'\n\
        allowed={'staging-manifest.json', 'integration/geo_rolling_breakdown.py',\
        \ 'tests/test_geo_rolling_breakdown.py'}\nwith zipfile.ZipFile(io.BytesIO(data))\
        \ as z:\n    assert set(z.namelist())==allowed and not z.testzip()\n    z.extractall('.')\n\
        PY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/geo-rolling-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Add fixture-only Geo rolling sample breakdown''

        git push

        '
