{
  "name": "Reviewed private increment batch48",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed original-contract streaming fixture consumer",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='eddba5c460b71dc8dd242115c2906d5cb188d5a2188c220394809cab2fda5254'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/news_export/original_stream.py', 'integration/news_export/raw_pager.py', 'staging-manifest.json', 'integration/news_export/ORIGINAL_STREAM_LIMITS.md', 'tests/news_export/test_original_stream.py'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/news_export/original_stream.py': '73fd0b34cc5d770a44070f825fd1c2b28814d94f0a2fc86df38d858b9dcee30a', 'integration/news_export/ORIGINAL_STREAM_LIMITS.md': '3506c2cd590e899065301863a3cacaa7f66933c243d9b52df4ce4a71ed58b642', 'integration/news_export/raw_pager.py': '5ced324a9dbacbe529dd7ba8f88f865c4584ede863132961a34deede1174640b', 'tests/news_export/test_original_stream.py': 'bb0baf099a6af1dfe43d71d66f7153a08e7d978801bc8eda53ee0cbfd91d4af0', 'staging-manifest.json': '97687e9b8b7efa2ac48cfc782cbfb42856ddf72eab8ec514641c77137392273f'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/news_export/original_stream.py integration/news_export/ORIGINAL_STREAM_LIMITS.md integration/news_export/raw_pager.py tests/news_export/test_original_stream.py staging-manifest.json\ngit commit -m 'Save reviewed original-contract streaming fixture consumer'\ngit push\nrm .github/workflows/reviewed-batch48.yml\ngit add .github/workflows/reviewed-batch48.yml\ngit commit -m 'Retire batch48 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
