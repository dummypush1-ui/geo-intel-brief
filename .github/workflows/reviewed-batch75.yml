{
  "name": "Reviewed private increment batch75",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed offline increment 75",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/article_archive.py', 'staging-manifest.json', 'integration/ARTICLE_ARCHIVE_LIMITS.md', 'tests/test_article_archive.py', 'integration/FEATURE_STATUS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/article_archive.py': 'f0ab086c622a6b6299c896d301b3a5dadecbc48f75f55dd7677e3efdb07706ee', 'integration/ARTICLE_ARCHIVE_LIMITS.md': 'f449ed2efdcbbca2a76ec5e3aa920edb538486b7e5c86f6dba460dd1d9cc9994', 'tests/test_article_archive.py': 'ee3229a5181ed29053071e83996a97038078d0d32b2ca3be66e3570eff0cadfc', 'integration/FEATURE_STATUS.md': 'c2411b4557655d55e730ed3a895bf12a73733ecc4514b35625171635880cc1af', 'staging-manifest.json': 'e4e8e85faae2d299bbebbc60d718fb1463bbd1a908649ef40f6abcacf5e1deff'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/article_archive.py integration/ARTICLE_ARCHIVE_LIMITS.md tests/test_article_archive.py integration/FEATURE_STATUS.md staging-manifest.json\ngit commit -m 'Save reviewed offline increment 75'\ngit push\nrm .github/workflows/reviewed-batch75.yml\ngit add .github/workflows/reviewed-batch75.yml\ngit commit -m 'Retire batch75 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
