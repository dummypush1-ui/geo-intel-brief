{
  "name": "Reviewed weekly map wiring batch32",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply reviewed private increment",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='75b8c1719f17dfe54737bee50361f3eb4d5c9be68b3cb26c06973da061b65263'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n assert set(z.namelist())=={'tests/test_weekly_routes.py', 'integration/ui/map.js', 'integration/ui/weekly.css', 'integration/ui/weekly.html', 'integration/ui/geo_map_ui.js', 'integration/ui/map.css', 'tests/geospatial/test_map_route.py', 'integration/news_api.py', 'tests/accounts/test_accounts.py', 'staging-manifest.json', 'integration/geospatial/response.py', 'integration/ui/workspace.html', 'integration/geospatial/ui/map.css', 'tests/browser_map.py', 'integration/ui/geo_map.css', 'integration/geospatial/geo_map.css', 'integration/ui/map.html', 'integration/WEEKLY_REPORT_LIMITS.md', 'tests/browser_weekly.py', 'integration/ui/weekly.js', 'integration/weekly_report/_render.py', 'integration/geospatial/ui/map.js', 'integration/FINDER_PARITY_PLAN.md', 'integration/geospatial/ui/map.html'} and not z.testzip()\n z.extractall('.')\nPY\ngit add integration/news_api.py integration/ui/workspace.html integration/ui/weekly.html integration/ui/weekly.js integration/ui/weekly.css integration/weekly_report/_render.py integration/WEEKLY_REPORT_LIMITS.md integration/FINDER_PARITY_PLAN.md tests/test_weekly_routes.py tests/browser_weekly.py tests/accounts/test_accounts.py tests/geospatial/test_map_route.py tests/browser_map.py staging-manifest.json integration/geospatial/response.py integration/geospatial/geo_map.css integration/geospatial/ui/map.html integration/geospatial/ui/map.js integration/geospatial/ui/map.css integration/ui/map.html integration/ui/map.js integration/ui/map.css integration/ui/geo_map_ui.js integration/ui/geo_map.css\ngit commit -m 'Wire reviewed weekly PDF and reference map privately'\ngit push\nrm .github/workflows/reviewed-batch32.yml\ngit add .github/workflows/reviewed-batch32.yml\ngit commit -m 'Retire batch32 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
