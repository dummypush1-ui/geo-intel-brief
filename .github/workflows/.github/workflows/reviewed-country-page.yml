{
  "name": "Private reviewed country page",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply reviewed country-page increment",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='6bc75062ff3aebc73b4e3244d8d377fa2ee7bfba56d2194614d7b1e7d9c1af76'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n assert set(z.namelist())=={'integration/country_page.py', 'integration/ui/countries.js', 'integration/COUNTRY_PAGE_LIMITS.md', 'integration/ui/countries.css', 'tests/test_country_page.py', 'integration/ui/countries.html', 'staging-manifest.json', 'tests/browser_country_page.py', 'integration/news_api.py', 'integration/ui/workspace.html'} and not z.testzip()\n z.extractall('.')\nPY\ngit add integration/country_page.py integration/ui/countries.html integration/ui/countries.js integration/ui/countries.css integration/ui/workspace.html integration/news_api.py integration/COUNTRY_PAGE_LIMITS.md tests/test_country_page.py tests/browser_country_page.py staging-manifest.json\ngit commit -m 'Add private trade-country page and local watchlist'\ngit push\nrm .github/workflows/reviewed-country-page.yml\ngit add .github/workflows/reviewed-country-page.yml\ngit commit -m 'Retire country-page backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
