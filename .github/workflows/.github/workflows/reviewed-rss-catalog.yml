{
  "name": "Private reviewed RSS candidate catalog",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply reviewed disabled RSS inventory",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='4689df255722fda4aa7ff705cf41963bc37a84b73dc6a41568500c5a98484b0f'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n assert set(z.namelist())=={'integration/rss_catalog/README.md', 'integration/rss_catalog/catalog.py', 'integration/rss_catalog/candidates.json', 'tests/test_rss_catalog.py', 'staging-manifest.json', 'integration/rss_catalog/__init__.py'} and not z.testzip()\n z.extractall('.')\nPY\ngit add integration/rss_catalog/__init__.py integration/rss_catalog/catalog.py integration/rss_catalog/candidates.json integration/rss_catalog/README.md tests/test_rss_catalog.py staging-manifest.json\ngit commit -m 'Add disabled independently discovered RSS candidate catalog'\ngit push\nrm .github/workflows/reviewed-rss-catalog.yml\ngit add .github/workflows/reviewed-rss-catalog.yml\ngit commit -m 'Retire RSS catalog backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
