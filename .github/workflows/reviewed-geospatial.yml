{
  "name": "Private reviewed geospatial modules",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply offline geospatial package",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='6294be7f112a1f19ac2c2ad9789ce9226d173ae82706dd03bd60dc2d011aa2aa'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n assert set(z.namelist())=={'tests/geospatial/__init__.py', 'tests/geospatial/preview/make_payload.py', 'tests/geospatial/test_geospatial.py', 'integration/geospatial/__init__.py', 'integration/geospatial/ships.py', 'tests/geospatial/url_parity.mjs', 'tests/geospatial/preview/hostile.json', 'tests/geospatial/preview/payload.json', 'integration/geospatial/features.py', 'tests/geospatial/preview/preview.js', 'integration/geospatial/README.md', 'integration/geospatial/_safe.py', 'integration/geospatial/map_ui.js', 'tests/geospatial/preview/real-chokepoints.json', 'integration/geospatial/geo_map.css', 'tests/geospatial/preview/preview.css', 'integration/geospatial/data/chokepoints_wikidata.json', 'staging-manifest.json', 'tests/geospatial/preview/preview.html', 'integration/geospatial/data/DATA_SOURCES.md', 'integration/geospatial/fixtures.py', 'integration/geospatial/payload.py', 'tests/geospatial/url_vectors.json'} and not z.testzip()\n z.extractall('.')\nPY\ngit add integration/geospatial/README.md integration/geospatial/__init__.py integration/geospatial/_safe.py integration/geospatial/data/DATA_SOURCES.md integration/geospatial/data/chokepoints_wikidata.json integration/geospatial/features.py integration/geospatial/fixtures.py integration/geospatial/geo_map.css integration/geospatial/map_ui.js integration/geospatial/payload.py integration/geospatial/ships.py tests/geospatial/__init__.py tests/geospatial/preview/hostile.json tests/geospatial/preview/make_payload.py tests/geospatial/preview/payload.json tests/geospatial/preview/preview.css tests/geospatial/preview/preview.html tests/geospatial/preview/preview.js tests/geospatial/preview/real-chokepoints.json tests/geospatial/test_geospatial.py tests/geospatial/url_parity.mjs tests/geospatial/url_vectors.json staging-manifest.json\ngit commit -m 'Add reviewed offline geospatial display modules and isolated tests'\ngit push\nrm .github/workflows/reviewed-geospatial.yml\ngit add .github/workflows/reviewed-geospatial.yml\ngit commit -m 'Retire geospatial backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
