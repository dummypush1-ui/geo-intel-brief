{
  "name": "Reviewed Finder parity batch33",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply exact reviewed private Finder snapshot",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport urllib.request,hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='1636bc9ff8dc9e9f2943cd0b8790924b1b7cb4f85abf4674571c9e16a90387dd'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/finder_network.py', 'tests/browser_finder_static.py', 'integration/news_api.py', 'integration/FINDER_PARITY_PLAN.md', 'integration/geo_only_runtime.py', 'tests/test_finder_network.py', 'tests/browser_finder_network.py', 'integration/FINDER_NETWORK_LIMITS.md', 'staging-manifest.json', 'integration/FINDER_SNAPSHOT_NOTES.md', '.env.example', 'integration/runtime.py'} and not z.testzip()\n z.extractall('.')\nremote={'index.html': 'https://raw.githubusercontent.com/push2006/finder-hsn-codee/main/index.html', 'data.17204075ad25.js': 'https://finder-hsn-codee.onrender.com/data.17204075ad25.js', 'sw.js': 'https://raw.githubusercontent.com/push2006/finder-hsn-codee/main/sw.js', 'offline.html': 'https://finder-hsn-codee.onrender.com/offline.html', 'src/tradepartners.ts': 'https://raw.githubusercontent.com/push2006/finder-hsn-codee/main/src/tradepartners.ts', 'src/sanctions.ts': 'https://raw.githubusercontent.com/push2006/finder-hsn-codee/main/src/sanctions.ts'}\nexpected={'integration/finder_network.py': '07fc045266659eadbefef1b52829c4e185ccdc70a3362fbd076a9d79719b3232', 'integration/news_api.py': '6a34120a29e06f5aa4dece633adbf2e6bdc0d2328bc5d8ff3aa4e49b056c4066', 'integration/runtime.py': '3cf336efd9ad14396e445edaf09452bdfb9255ad86fca2cdcc6ce4dd82d8094e', 'integration/geo_only_runtime.py': '147126bcfecc9917162c70f00433006892a26a387b116c96f340519d39cf1faa', 'integration/FINDER_NETWORK_LIMITS.md': 'a5b3d3ecc8dfddc53374853649e1f0d4468d7a90be1a367b2ae35abe085da768', 'integration/FINDER_SNAPSHOT_NOTES.md': 'f17380d3c633e8dc55248303f209bcda6805006b5354f63a3c7fdecaa06375e4', 'tests/test_finder_network.py': '6b48236705d3aad92490e62509f5aa9f544f085dd82ca4d7f657ce68ab78ec72', 'tests/browser_finder_network.py': '97b4fcaf1861f06c6752473786c60056153fc3d98839772c399677b301443120', 'tests/browser_finder_static.py': 'a3715feb82e530300f3e58550f772294ad1c738c3cd3e51b17364641d6b00d45', '.env.example': '0f08a4720d86a4dca311f83e5e4ab795f6620a74d25ec6bd492165b114cd8ecc', 'integration/FINDER_PARITY_PLAN.md': 'fa512f062aa5fc0a1c5646f58070df5d035ad409977e0aa02c0540125988fc16', 'staging-manifest.json': '86e3937242f157a82f8680832901bf8025b05507089a833a45323956e199db1e', 'index.html': '83a9704fdb322434e2505fb78f2c1f3a8ba158cc19e50dfe61b5cd22e69883b3', 'data.17204075ad25.js': '17204075ad25512b76900835aca83960c82ed8d9e8a997c4e23e954713d89330', 'sw.js': 'b56ba5ab099bdfda5f26115e55fd0da5a13f573a0d8f26d4935d0bed514389c5', 'offline.html': 'cfc66f0e2234812bb7400e9f541f50f5ed951c449dbc8628140579582a3985fc', 'src/tradepartners.ts': '470ff4c944038579e2efe08ef534dca2a219778645a3e7ccfd455e67c9e4893a', 'src/sanctions.ts': '78e3cea19af9e70d7278839b00710d4f241e3e3b6926637c06ce3204d231c0af'}\nfor p,url in remote.items():\n with urllib.request.urlopen(url,timeout=30) as r:data=r.read(30_000_001)\n assert len(data)<=30_000_000 and hashlib.sha256(data).hexdigest()==expected[p],p\n Path(p).parent.mkdir(parents=True,exist_ok=True);Path(p).write_bytes(data)\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/finder_network.py integration/news_api.py integration/runtime.py integration/geo_only_runtime.py integration/FINDER_NETWORK_LIMITS.md integration/FINDER_SNAPSHOT_NOTES.md tests/test_finder_network.py tests/browser_finder_network.py tests/browser_finder_static.py .env.example integration/FINDER_PARITY_PLAN.md staging-manifest.json index.html data.17204075ad25.js sw.js offline.html src/tradepartners.ts src/sanctions.ts\ngit commit -m 'Port reviewed Finder snapshot and gated network preview'\ngit push\nrm .github/workflows/reviewed-batch33.yml\ngit add .github/workflows/reviewed-batch33.yml\ngit commit -m 'Retire batch33 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
