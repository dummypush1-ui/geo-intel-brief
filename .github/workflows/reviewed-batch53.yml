{
  "name": "Reviewed private increment batch53",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed supplied stream revision byte transform",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='3a1ef40f682f447d23a1323be30c2b4f36f74e16b9634a0affe6daec0131adbc'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'tests/test_stream_revision.py', 'integration/brics_streams.py', 'integration/stream_revision.py', 'staging-manifest.json', 'integration/STREAM_REVISION_LIMITS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/stream_revision.py': '39f607f7b2ae8b81b185bc4dbc610259efa103f51f7bb22f350e06bc93c8f06a', 'integration/STREAM_REVISION_LIMITS.md': 'ac5c8731800995d24ea21e32795784ab6aae03da4d2f7890eeaf2f8490d110e4', 'tests/test_stream_revision.py': '8345a29e6a48fb855c61c2bfd1c8b185fb3d059648ad520df0a24fc3ab86ba85', 'integration/brics_streams.py': '0add85dfd3b541b2d681daad0d21af4a6320dea89d8c9254baf9a308d9a89b10', 'staging-manifest.json': '6c7f623bd6b954ea78826fe6fb6340c4aee75e77dadb2239cba234f7853719e0'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/stream_revision.py integration/STREAM_REVISION_LIMITS.md tests/test_stream_revision.py integration/brics_streams.py staging-manifest.json\ngit commit -m 'Save reviewed supplied stream revision byte transform'\ngit push\nrm .github/workflows/reviewed-batch53.yml\ngit add .github/workflows/reviewed-batch53.yml\ngit commit -m 'Retire batch53 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
