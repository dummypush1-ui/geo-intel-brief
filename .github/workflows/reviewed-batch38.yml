{
  "name": "Reviewed CSV contracts batch38",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply reviewed offline CSV contracts",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='85e4bbda65e646c3a0cef9f2f8eb8001cb7fc72567b7c750f64108b1d471ea93'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/accounts/README.md', 'tests/news_export/test_original_contract.py', 'integration/accounts/HTTP_FIXTURE_LIMITS.md', 'staging-manifest.json', 'integration/news_export/original_contract.py', 'integration/news_export/ORIGINAL_CONTRACT_LIMITS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/news_export/original_contract.py': '7f46af666deae5793df9c066e2a7afbf38de6317e195c74cb438a4206802841e', 'integration/news_export/ORIGINAL_CONTRACT_LIMITS.md': 'abdcc9c9a6f4ec5c9870ae118175e68294d760d34baff2f426eb4b780c70d8f7', 'tests/news_export/test_original_contract.py': 'c9c75c0d717119b567a91b471782a91921282763b1edd122b7c257f251c6e062', 'integration/accounts/HTTP_FIXTURE_LIMITS.md': '97c8717037cd7c0ce6d6fcc27738de4e165b5bde70814238e3b198401be833d4', 'integration/accounts/README.md': 'e439a4604863382f28a8c3c7ba2e5fcbca3e971fca152aa747463b27a154feb3', 'staging-manifest.json': '8439bd784824187be3424fa632035311cce7bd1587d8a168a6090d3b71b5aa2c'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/news_export/original_contract.py integration/news_export/ORIGINAL_CONTRACT_LIMITS.md tests/news_export/test_original_contract.py integration/accounts/HTTP_FIXTURE_LIMITS.md integration/accounts/README.md staging-manifest.json\ngit commit -m 'Port reviewed original CSV snapshot contracts'\ngit push\nrm .github/workflows/reviewed-batch38.yml\ngit add .github/workflows/reviewed-batch38.yml\ngit commit -m 'Retire batch38 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
