        {
          "name": "Save reviewed offline increment 76",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/collector_mail_fixture.py', 'integration/COLLECTOR_MAIL_FIXTURE_LIMITS.md', 'staging-manifest.json', 'tests/test_collector_mail_fixture.py', 'integration/FEATURE_STATUS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/collector_mail_fixture.py': '3b2c7bd871656ac69bf380d0425132a0919fa7eda440bdf5467fe450dcc51873', 'integration/COLLECTOR_MAIL_FIXTURE_LIMITS.md': '6e2d181d296dcfde55c6e66d148a036dfc0018dee458280732435208e8206cfd', 'tests/test_collector_mail_fixture.py': 'd70865b5e637e688807d6f2b45ffcc45609857cf66fb01dfbb198f7c86a10397', 'integration/FEATURE_STATUS.md': 'ece533687f49860be0e20dfe2e5e8d97617c2de7454327da5703107709512bbe', 'staging-manifest.json': '544f026a3cfa53a70d7858d83eceec9b40f869e1a91adcaeafe1cedec89698c7'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/collector_mail_fixture.py integration/COLLECTOR_MAIL_FIXTURE_LIMITS.md tests/test_collector_mail_fixture.py integration/FEATURE_STATUS.md staging-manifest.json\ngit commit -m 'Save reviewed offline increment 76'\ngit push\nrm .github/workflows/reviewed-batch76.yml\ngit add .github/workflows/reviewed-batch76.yml\ngit commit -m 'Retire batch76 backup workflow'\ngit push\n"
        }
      ]
