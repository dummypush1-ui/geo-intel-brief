name: Populate private staging tree
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Copy verified public finder baseline
        run: |
          git clone --quiet https://github.com/push2006/finder-hsn-codee.git /tmp/finder
          git -C /tmp/finder checkout --quiet ddbaf5a69ea87913976cf4ea0acd3c74cad1833c
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('/tmp/finder')
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.name.startswith('.env'): continue
              rel=p.relative_to(root)
              if rel.parts[:2]==('.github','workflows'): target=Path('legacy-config/finder-workflows')/p.name
              elif str(rel)=='render.yaml': target=Path('legacy-config/finder-render.yaml')
              elif str(rel)=='README.md': target=Path('legacy-config/finder-README.md')
              else: target=rel
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,target)
          PY
      - name: Verify and unpack private overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,io,base64
          data=base64.b64decode(Path('private-overlay.b64').read_text(),validate=True)
          assert hashlib.sha256(data).hexdigest()=='213c119f527eec61603277b002ae246bdbaa0ce7e2a90dd90b9be250c4effaaf'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert not z.testzip()
              for info in z.infolist():
                  p=Path(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  assert p.parts[:2]!=('.github','workflows')
              z.extractall('.')
          Path('private-overlay.b64').unlink()
          PY
      - name: Fixture tests, no credentials or live data
        run: |
          pip install -r requirements-staging.txt
          python -m unittest discover -s tests -v
          python -m compileall -q integration
      - name: Commit staging only and retire bootstrap
        run: |
          rm .github/workflows/bootstrap-staging.yml
          git config user.name 'geo-intel-staging-bot'
          git config user.email 'staging@users.noreply.github.com'
          git add -A
          git commit -m 'Add preserved three-project staging tree and tested additive bridges'
          git push
