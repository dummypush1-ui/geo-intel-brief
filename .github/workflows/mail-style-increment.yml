name: Private mail decorative style support
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='83d6d1e443ed6d89257f415f322911de9e1f8fd347d105e16de23adeb99293de'\n\
        allowed={'integration/REPORT_STYLE_LIMITS.md', 'tests/test_report_styles.py',\
        \ 'integration/html_safety.py', 'integration/report_styles.py', 'staging-manifest.json',\
        \ 'tests/browser_report_styles.py'}\nwith zipfile.ZipFile(io.BytesIO(data))\
        \ as z:\n    assert set(z.namelist())==allowed and not z.testzip()\n    z.extractall('.')\n\
        PY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/mail-style-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Preserve bounded decorative report styles and document rendering
        limits''

        git push

        '
