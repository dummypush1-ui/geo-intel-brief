{
  "name": "Reviewed private increment batch67",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed offline account transaction seam",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/accounts/mongo_store.py', 'tests/test_mongo_account_store.py', 'integration/accounts/MONGO_STORE_LIMITS.md', 'staging-manifest.json'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/accounts/mongo_store.py': '7e2618d61a19017b5140c92299a648ffceeeba246921b986761a4b6244eb7796', 'integration/accounts/MONGO_STORE_LIMITS.md': '04dfe9296398e82ecc893ae629386b1e789ef835d8ebe84fec971bc8e4b78744', 'tests/test_mongo_account_store.py': '69c36e6c3fea5a172ec228656818407d9268737b97f29e44d7b6fab154456c14', 'staging-manifest.json': 'b058860ae7447e12ca79efe8dd490fdbae32785d8c8091c88a2cddf45d0846a5'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/accounts/mongo_store.py integration/accounts/MONGO_STORE_LIMITS.md tests/test_mongo_account_store.py staging-manifest.json\ngit commit -m 'Save reviewed injected Mongo account transaction seam'\ngit push\nrm .github/workflows/reviewed-batch67.yml\ngit add .github/workflows/reviewed-batch67.yml\ngit commit -m 'Retire batch67 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
