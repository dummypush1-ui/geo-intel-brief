{
  "name": "Reviewed private increment batch56",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed current private feature status and open blockers",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='b4d74234550ed532fabba188b9b8087a5c0de3424e233b137742082848f5daa8'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'README.md', 'integration/COUNTRY_SIGNALS_LIMITS.md', 'staging-manifest.json', 'REVIEW.md', 'integration/GEO_ONLY_LIMITS.md', 'integration/FEATURE_STATUS.md', 'integration/cross-connections.json'} and not z.testzip()\n z.extractall('.')\nexpected={'README.md': '4c1cc6279abaf55125b57a641b4d77c7f4b23922aaacde4d798362f3d302056a', 'REVIEW.md': 'ad2378a299e43b25eff3d0b1607e882613d6a5fc832503dc887ab65bd7384a46', 'integration/FEATURE_STATUS.md': '2c2060f20bb0e8e6da3dc951e6afe5d26e1ca0d7a518fe1ad3fd489645f07627', 'integration/cross-connections.json': '935ebaa53ff6eebf69f7a2a083e45a1284e92cccfa43d157c335c7f06990dcda', 'integration/GEO_ONLY_LIMITS.md': '05d80e5d7ccbd6052c1cb56e881ffa7308600d1e774576be9eb7e0d5c50f7778', 'integration/COUNTRY_SIGNALS_LIMITS.md': '448b9680453c8bcfc42a9f3bf93022060a8b8d670b0681962f525d95b7e5c449', 'staging-manifest.json': 'a39c6c119be27258e14667aa6a31736a6832cdb59abc4f4180fb37ec8e895bae'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add README.md REVIEW.md integration/FEATURE_STATUS.md integration/cross-connections.json integration/GEO_ONLY_LIMITS.md integration/COUNTRY_SIGNALS_LIMITS.md staging-manifest.json\ngit commit -m 'Save reviewed current private feature status and open blockers'\ngit push\nrm .github/workflows/reviewed-batch56.yml\ngit add .github/workflows/reviewed-batch56.yml\ngit commit -m 'Retire batch56 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
