{
  "name": "Reviewed private increment batch64",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed offline collector contract",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'staging-manifest.json', 'integration/GEO_COLLECTOR_CONTRACT_LIMITS.md', 'tests/test_geo_collector_contract.py', 'integration/geo_collector_contract.py'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/geo_collector_contract.py': 'a2c2047d37b8d12132af784c4ca9bab697a53492580e90e98a77261e6d965d9d', 'integration/GEO_COLLECTOR_CONTRACT_LIMITS.md': 'ec5c229454d3063dbcc805c5cfd238e63048670f40250ab3dc0e3ca5d093db6e', 'tests/test_geo_collector_contract.py': '9681ef874637ba5ba3eb303382d03ebc400e105a649a8ccc0d8069670b4f8469', 'staging-manifest.json': 'daaf52c6226f5ee09af1428f69cafc3b1d5627980bcdcad20523a8a2edb4c58d'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/geo_collector_contract.py integration/GEO_COLLECTOR_CONTRACT_LIMITS.md tests/test_geo_collector_contract.py staging-manifest.json\ngit commit -m 'Save reviewed Geo original collector document contract'\ngit push\nrm .github/workflows/reviewed-batch64.yml\ngit add .github/workflows/reviewed-batch64.yml\ngit commit -m 'Retire batch64 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
