{
  "name": "Private reviewed watched-country updates",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply reviewed manual updates and privacy",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='0f07448c6c357f57e1de06473072f59be794b74cd0db865e1f96b3e876b712cc'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n assert set(z.namelist())=={'tests/test_country_page.py', 'tests/test_watch_updates.py', 'integration/storage_reader.py', 'tests/test_private_news_fields.py', 'integration/dashboard_model.py', 'integration/loaded_news.py', 'integration/loaded_charts.py', 'integration/critical_stories.py', 'integration/country_page.py', 'integration/PRIVATE_NEWS_FIELDS_LIMITS.md', 'integration/story_links.py', 'integration/ui/countries.html', 'integration/ui/countries.js', 'integration/WATCH_UPDATES_LIMITS.md', 'integration/news_api.py', 'integration/relevance.py', 'staging-manifest.json', 'integration/public_news.py', 'tests/browser_watch_updates.py', 'integration/ui/watch_updates.js'} and not z.testzip()\n z.extractall('.')\nPY\ngit add integration/public_news.py integration/news_api.py integration/critical_stories.py integration/storage_reader.py integration/PRIVATE_NEWS_FIELDS_LIMITS.md integration/country_page.py integration/loaded_news.py integration/story_links.py integration/relevance.py integration/loaded_charts.py integration/dashboard_model.py tests/test_private_news_fields.py tests/test_country_page.py staging-manifest.json integration/ui/watch_updates.js integration/ui/countries.js integration/ui/countries.html integration/WATCH_UPDATES_LIMITS.md tests/test_watch_updates.py tests/browser_watch_updates.py\ngit commit -m 'Add manual country updates and shared private-field boundary'\ngit push\nrm .github/workflows/reviewed-watch-updates.yml\ngit add .github/workflows/reviewed-watch-updates.yml\ngit commit -m 'Retire watched-country backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
