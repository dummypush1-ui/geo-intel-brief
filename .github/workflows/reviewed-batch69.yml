{
  "name": "Reviewed private increment batch69",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed private responsive preview frame",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'staging-manifest.json', 'integration/REPORT_PREVIEW_FRAME_LIMITS.md', 'integration/report_preview_frame.py', 'integration/FEATURE_STATUS.md', 'tests/test_report_preview_frame.py', 'integration/digest_preview.py'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/FEATURE_STATUS.md': '5ffb2e62ea7d11ef4f47c4a7a4b3913998e90409dcd48fb8f0bc04df94f35b2e', 'integration/REPORT_PREVIEW_FRAME_LIMITS.md': 'e3a81eab0783cd0d48dc6ccb7d8d0a4763ac5972457463a7f2f75eca067cbd13', 'integration/digest_preview.py': '4b492669e765a593ea54ffa66d5fcc6361be034f764c5054ba808f11cd6be30c', 'integration/report_preview_frame.py': 'd5f553041aa1d017362b13a40ac089ea2bbdb9907aa9516afaaa0412a06e47df', 'tests/test_report_preview_frame.py': 'b5cc4b6468230022cc15f9f2d085662c4eff5dfc9de5c10971ca140f290dec83', 'staging-manifest.json': 'f30fec5b58818b008fa9d80b1d752cb16304e94218b08c08a8c9d47b3206a30c'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/FEATURE_STATUS.md integration/REPORT_PREVIEW_FRAME_LIMITS.md integration/digest_preview.py integration/report_preview_frame.py tests/test_report_preview_frame.py staging-manifest.json\ngit commit -m 'Save reviewed private mobile report preview frame'\ngit push\nrm .github/workflows/reviewed-batch69.yml\ngit add .github/workflows/reviewed-batch69.yml\ngit commit -m 'Retire batch69 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
