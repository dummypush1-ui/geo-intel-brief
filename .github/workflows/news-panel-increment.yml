name: Private news panel controls
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='3763d17dd44ad3019dcbdc1e228f2734ff13d5c1773d321df1716b17bdc53499'\n\
        allowed={'integration/news_api.py', 'integration/ui/workspace.css', 'integration/ui/workspace.html',\
        \ 'staging-manifest.json', 'integration/ui/workspace.js', 'tests/test_critical_stories.py',\
        \ 'integration/NEWS_PANEL_LIMITS.md', 'integration/critical_stories.py'}\n\
        with zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert set(z.namelist())==allowed\
        \ and not z.testzip()\n    z.extractall('.')\nPY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/news-panel-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Add private news theme refresh controls and critical panel''

        git push

        '
