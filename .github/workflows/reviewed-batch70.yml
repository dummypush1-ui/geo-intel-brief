{
  "name": "Reviewed private increment batch70",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed offline Geo sample probe",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/FEATURE_STATUS.md', 'integration/GEO_SAMPLE_PROBE_LIMITS.md', 'integration/geo_sample_probe.py', 'tests/test_geo_sample_probe.py', 'staging-manifest.json'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/FEATURE_STATUS.md': '70eaf0de9452ed55199d3dedd9d91a9c0421200ba9d6b77aefb0f623edcd7041', 'integration/GEO_SAMPLE_PROBE_LIMITS.md': '9cde4838179cf49f6bf3bcffb6d490757d5630e50b91d9949603bfa022e0aa46', 'integration/geo_sample_probe.py': '875990c2646571fbf5741000540d3211e63081d8c03af396d8fde0f343de39f7', 'tests/test_geo_sample_probe.py': '089cb9966c4107ea93ee77fc4e542875c76cc51deded62e336ea4c2e30118922', 'staging-manifest.json': 'ff5538e534275ff65bd4fedbb067b449ef983f13c3519ddeb4aca333effa27b2'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/FEATURE_STATUS.md integration/GEO_SAMPLE_PROBE_LIMITS.md integration/geo_sample_probe.py tests/test_geo_sample_probe.py staging-manifest.json\ngit commit -m 'Save reviewed separate bounded Geo sample probe'\ngit push\nrm .github/workflows/reviewed-batch70.yml\ngit add .github/workflows/reviewed-batch70.yml\ngit commit -m 'Retire batch70 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
