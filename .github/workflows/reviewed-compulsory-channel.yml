{
  "name": "Private reviewed compulsory channel",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply reviewed channel increment",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='504aff2f3bdd5c7c7ce1a74a06eb280605cded3fd62f1cf3542770351b864dd9'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n assert set(z.namelist())=={'integration/ui/workspace.css', 'tests/browser_compulsory_channels.py', 'integration/ui/workspace.html', 'staging-manifest.json', 'tests/test_compulsory_channels.py', 'integration/ui/live_channels.js', 'integration/ui/live_news.js', 'integration/COMPULSORY_CHANNEL_LIMITS.md'} and not z.testzip()\n z.extractall('.')\nPY\ngit add integration/ui/live_channels.js integration/ui/live_news.js integration/ui/workspace.html integration/ui/workspace.css integration/COMPULSORY_CHANNEL_LIMITS.md tests/test_compulsory_channels.py tests/browser_compulsory_channels.py staging-manifest.json\ngit commit -m 'Make Republic compulsory and preserve removable channel extras'\ngit push\nrm .github/workflows/reviewed-compulsory-channel.yml\ngit add .github/workflows/reviewed-compulsory-channel.yml\ngit commit -m 'Retire compulsory-channel backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
