{
  "name": "Private reviewed weekly report",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply offline weekly PDF module",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='1c7ab43b83b7f3b41ed2d3a94b84e772e161f9dcd53cb5b997aae2de847778ee'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n assert set(z.namelist())=={'staging-manifest.json', 'tests/weekly_report/__init__.py', 'integration/weekly_report/_pdf.py', 'integration/weekly_report/_metrics.py', 'integration/weekly_report/report.py', 'tests/weekly_report/test_report.py', 'integration/weekly_report/__init__.py', 'integration/weekly_report/README.md', 'integration/weekly_report/_render.py'} and not z.testzip()\n z.extractall('.')\nPY\ngit add integration/weekly_report/README.md integration/weekly_report/__init__.py integration/weekly_report/_metrics.py integration/weekly_report/_pdf.py integration/weekly_report/_render.py integration/weekly_report/report.py tests/weekly_report/__init__.py tests/weekly_report/test_report.py staging-manifest.json\ngit commit -m 'Add bounded offline weekly PDF module and development tests'\ngit push\nrm .github/workflows/reviewed-weekly-report.yml\ngit add .github/workflows/reviewed-weekly-report.yml\ngit commit -m 'Retire weekly report backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
