{
  "name": "Reviewed private increment batch63",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed offline snapshot adapter",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/news_export/geo_snapshot.py', 'staging-manifest.json', 'integration/news_export/GEO_SNAPSHOT_LIMITS.md', 'tests/test_geo_snapshot.py'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/news_export/geo_snapshot.py': '3e73e4c4f45b439c6ccf59226fe106f82d01970651f743e92fd35c4c980915c3', 'integration/news_export/GEO_SNAPSHOT_LIMITS.md': '71734b010f30f2fabab37e54dc8cdbaccb31ebc649bfb342c9666d7d8b1949c3', 'tests/test_geo_snapshot.py': '27e8215960ae99d0d5e2c3f2b4e0b94397247f9d417f01d32205669fea537d5d', 'staging-manifest.json': 'df8bda34aa1fefc2f7297b85a0ec88ed48064dbe5ba09835431b9e117e87bf6f'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/news_export/geo_snapshot.py integration/news_export/GEO_SNAPSHOT_LIMITS.md tests/test_geo_snapshot.py staging-manifest.json\ngit commit -m 'Save reviewed Geo snapshot original export adapter'\ngit push\nrm .github/workflows/reviewed-batch63.yml\ngit add .github/workflows/reviewed-batch63.yml\ngit commit -m 'Retire batch63 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
