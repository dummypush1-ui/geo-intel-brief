{
  "name": "Reviewed private increment batch49",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed dev-only original CSV fixture HTTP boundary",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='393958a77d4304e74fd095dbb5b0ba56f98c8ab5125293b1f43ad43a4ba2d5d4'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/EXPORT_DIGEST_LIMITS.md', 'integration/news_export/FIXTURE_HTTP_LIMITS.md', 'integration/news_export/fixture_http.py', 'integration/FINDER_PARITY_PLAN.md', 'staging-manifest.json', 'tests/news_export/test_fixture_http.py'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/news_export/fixture_http.py': '14c1a0339e553462584137cac34d740f3565b411fab926d961cf4e3d5123a780', 'integration/news_export/FIXTURE_HTTP_LIMITS.md': 'ce9b9897da5e2e73f49ddab61d4c8946eb2ea915a5e9232cc48fab656a8b01ff', 'tests/news_export/test_fixture_http.py': '5b5ded65e6c00cd55f7a71392d9a01bb0bde9c2045147ec4041cb93fb1a1fa53', 'integration/FINDER_PARITY_PLAN.md': '496a1b1f8c70078eccbb985f0374224e162f3e40c1ff55caffd958c2a84e765e', 'integration/EXPORT_DIGEST_LIMITS.md': 'ca6cd4cdfc1eb03dcca5b6ad0062577836f354c3416c1faa7c84423401209aa7', 'staging-manifest.json': '533c412dbdb7401064f110a305cd1638adb53c4833085e1ca9d0f459b948b26e'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/news_export/fixture_http.py integration/news_export/FIXTURE_HTTP_LIMITS.md tests/news_export/test_fixture_http.py integration/FINDER_PARITY_PLAN.md integration/EXPORT_DIGEST_LIMITS.md staging-manifest.json\ngit commit -m 'Save reviewed dev-only original CSV fixture HTTP boundary'\ngit push\nrm .github/workflows/reviewed-batch49.yml\ngit add .github/workflows/reviewed-batch49.yml\ngit commit -m 'Retire batch49 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
