name: Private original dashboard payload adapters
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='6270986769bd6e1b7398f9103ea00c1c21b9c6447d64914ecbb8a9b946890895'\n\
        allowed={'integration/original_dashboard_payloads.py', 'integration/dashboard_snapshots.py',\
        \ 'integration/ui/workspace.js', 'integration/youtube_links.py', 'staging-manifest.json',\
        \ 'tests/test_original_dashboard_payloads.py', 'tests/test_youtube_links.py',\
        \ 'tests/browser_dashboard_snapshots.py'}\nwith zipfile.ZipFile(io.BytesIO(data))\
        \ as z:\n    assert set(z.namelist())==allowed and not z.testzip()\n    z.extractall('.')\n\
        PY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/original-payload-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Preserve original event metadata and configured video links''

        git push

        '
