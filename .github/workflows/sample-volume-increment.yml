name: Private static loaded sample volume
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='8b9aa1cccfaeb8f2fafe6aead46848b331e5467e04783ddcc43522ebe18164c4'\n\
        allowed={'integration/news_api.py', 'tests/browser_sample_volume.py', 'integration/ui/workspace.html',\
        \ 'integration/ui/workspace.css', 'tests/test_sample_volume.py', 'integration/ui/workspace.js',\
        \ 'staging-manifest.json'}\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n\
        \    assert set(z.namelist())==allowed and not z.testzip()\n    z.extractall('.')\n\
        PY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/sample-volume-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Add static sample volume with truthful time accounting''

        git push

        '
