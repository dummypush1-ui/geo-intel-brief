{
  "name": "Reviewed private increment batch40",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Wire reviewed dry-run events digest preview",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='d45887d6e00672a93286071d937afd4d471b47bad05ddd2c541a3a4c09fcc08f'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'staging-manifest.json', 'integration/renderer_scope.py', 'integration/report_adapters.py', 'tests/test_digest_preview_routes.py', 'integration/digest_preview.py', 'tests/browser_event_digest.py', 'integration/news_api.py', 'integration/EVENT_READER_LIMITS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/digest_preview.py': 'd3265da45145f05434cb1e163af803f1eecd70847aa80a6b340e3ae2bfdfef88', 'integration/news_api.py': 'fa897ed78dc33761fb76624b2e8e6043795e07b017637ff7bb0d96e998c91c2b', 'integration/renderer_scope.py': 'b5cc8d3b8bce68a53b19ae9f28b14f1d1e6c5ac0046a9a2dcdf868b02ad7ba46', 'integration/report_adapters.py': 'af267f1950dc9fe0ed25757e1d3f380180239b7c89fa9bc6f0d872b8a1f7072a', 'integration/EVENT_READER_LIMITS.md': 'ba98984cd757f63d80e4f84e5eda53fa05e869cbb63d5e6a4ecb240f6025dc64', 'tests/test_digest_preview_routes.py': 'b171fed8fd837dc9d800b00fd17d13fcc6b26e8341ca2e8e31daecb7ba14378e', 'tests/browser_event_digest.py': 'a27b4a2c654538299e19e2324090ebbcb1c15d78804f14daf1bc123b93163163', 'staging-manifest.json': '57ea061a8986da897f6d2221a3dec5f7ed25fb48e231508e1041e76006d12322'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/digest_preview.py integration/news_api.py integration/renderer_scope.py integration/report_adapters.py integration/EVENT_READER_LIMITS.md tests/test_digest_preview_routes.py tests/browser_event_digest.py staging-manifest.json\ngit commit -m 'Wire reviewed dry-run events digest preview'\ngit push\nrm .github/workflows/reviewed-batch40.yml\ngit add .github/workflows/reviewed-batch40.yml\ngit commit -m 'Retire batch40 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
