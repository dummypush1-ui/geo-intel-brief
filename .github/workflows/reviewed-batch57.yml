{
  "name": "Reviewed private increment batch57",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed supplied page watch integrity contract",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='59955b2671c17ebf4794546b1a80e4511895f88c9b8d27d711683178a7ea62f6'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'tests/test_page_watch_contract.py', 'integration/PAGE_WATCH_LIMITS.md', 'integration/page_watch.py', 'tests/test_page_watch.py', 'staging-manifest.json'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/page_watch.py': 'a4d45a456769b1e6f17496ce24b04ccc3a97e25cc28a3ac3b15bf736645346dc', 'integration/PAGE_WATCH_LIMITS.md': 'e8a8d524b4ace3e9081e95f1434233582a4e3ff5d1df4fe4512b692773313cf5', 'tests/test_page_watch.py': '0a9ec099c21e937d745e2124df210864243923022aac3d0c2c69c6dd1ee539c6', 'tests/test_page_watch_contract.py': 'b03dddaf8a43ea5946d62204c79dd9a8e3c7846a8bf5fe3c61cfa53afa88b3bc', 'staging-manifest.json': '21f80c1a448e9576dc520674ed8805a2652e47084c316b4880d28e700c1c4774'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/page_watch.py integration/PAGE_WATCH_LIMITS.md tests/test_page_watch.py tests/test_page_watch_contract.py staging-manifest.json\ngit commit -m 'Save reviewed supplied page watch integrity contract'\ngit push\nrm .github/workflows/reviewed-batch57.yml\ngit add .github/workflows/reviewed-batch57.yml\ngit commit -m 'Retire batch57 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
