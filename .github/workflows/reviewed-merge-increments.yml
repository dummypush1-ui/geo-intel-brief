{
  "name": "Private reviewed merge increments",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply reviewed private increments in order",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='776fe80463d5d290a4678ac40516f5ae64875755fdabc8baf349d696b0563259'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert set(z.namelist())=={'integration/source_health.py', 'integration/ui/workspace.css', 'integration/ui/workspace.js', 'tests/test_source_health.py', 'integration/SOURCE_HEALTH_LIMITS.md', 'integration/news_api.py', 'integration/ui/workspace.html', 'staging-manifest.json'} and not z.testzip()\n    z.extractall('.')\nPY\ngit add integration/source_health.py integration/SOURCE_HEALTH_LIMITS.md integration/news_api.py integration/ui/workspace.html integration/ui/workspace.js integration/ui/workspace.css tests/test_source_health.py staging-manifest.json\ngit commit -m 'Add private captured source health panel'\ngit push\npython3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='82ddbfb0f72b8755f03be1d1d4b0aa3e64709249df866a843ec7125ef6dee20f'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert set(z.namelist())=={'integration/ui/workspace.css', 'integration/ui/live_channels.js', 'integration/LIVE_NEWS_LIMITS.md', 'integration/ui/workspace.js', 'integration/news_api.py', 'integration/ui/live_news.js', 'integration/ui/workspace.html', 'staging-manifest.json', 'tests/test_live_news_ui.py'} and not z.testzip()\n    z.extractall('.')\nPY\ngit add integration/ui/live_news.js integration/ui/live_channels.js integration/LIVE_NEWS_LIMITS.md integration/news_api.py integration/ui/workspace.html integration/ui/workspace.js integration/ui/workspace.css tests/test_live_news_ui.py staging-manifest.json\ngit commit -m 'Add private live news and local channel preview'\ngit push\npython3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='bf6d872476274362f4cde904fd039c1686e9cd201b6d1998c323e7749b94c4fb'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert set(z.namelist())=={'integration/single_db_runtime.py', 'integration/SINGLE_DB_PLAN_LIMITS.md', 'tests/test_single_db_plan.py', 'tests/test_single_db_runtime.py', 'integration/single_db_plan.py', 'staging-manifest.json'} and not z.testzip()\n    z.extractall('.')\nPY\ngit add integration/single_db_plan.py integration/single_db_runtime.py integration/SINGLE_DB_PLAN_LIMITS.md tests/test_single_db_plan.py tests/test_single_db_runtime.py staging-manifest.json\ngit commit -m 'Add explicit one database read composition seam'\ngit push\nrm .github/workflows/reviewed-merge-increments.yml\ngit add .github/workflows/reviewed-merge-increments.yml\ngit commit -m 'Retire scoped private backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
