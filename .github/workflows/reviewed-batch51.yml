{
  "name": "Reviewed private increment batch51",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed supplied retention fidelity audit",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='913d378fcc6e0ad0121a990175f35892a1f77e5701d480c300da7df22f61189b'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/retention_audit.py', 'staging-manifest.json', 'tests/test_retention_audit.py', 'integration/RETENTION_AUDIT_LIMITS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/retention_audit.py': 'e27fe8c17a3b05ebef25d784877b7562556cbbf7a9f28a25961db660aa8e34ac', 'integration/RETENTION_AUDIT_LIMITS.md': '04d2776a42d4e24c441cd53eb057538c0ed9265a3dfdf5aa665fd77886e6ae93', 'tests/test_retention_audit.py': 'ea7d34b9940cfec1043778ee9f696b5104e594b1aca943b412a1fd0270e525ba', 'staging-manifest.json': 'acc60cd854cb994c803c057a6588392536356161805e932102f3d03a0547ce0c'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/retention_audit.py integration/RETENTION_AUDIT_LIMITS.md tests/test_retention_audit.py staging-manifest.json\ngit commit -m 'Save reviewed supplied retention fidelity audit'\ngit push\nrm .github/workflows/reviewed-batch51.yml\ngit add .github/workflows/reviewed-batch51.yml\ngit commit -m 'Retire batch51 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
