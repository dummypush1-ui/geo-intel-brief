{
  "name": "Reviewed private increment batch55",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed local Werkzeug export serving evidence",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='ad7fd5d0242b7339b1dd94f2f11e0c5531ca4ba792b014bb260a6d5773f61b15'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'staging-manifest.json', 'tests/news_export/test_fixture_serving.py', 'integration/news_export/LOCAL_SERVING_LIMITS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'tests/news_export/test_fixture_serving.py': 'd6743b4ca36b8a4d6ed975dc19bca048b25666bc91b981fbaf0c6de20d324d85', 'integration/news_export/LOCAL_SERVING_LIMITS.md': 'fc79461042c82e5367c96998ab2a35603bd37f1aab3f26038e629054a5de9b1c', 'staging-manifest.json': 'a4da9bc3cc2d0864e885ec2d043ded0d976cd5f63e7dd80d580fc75cc5495744'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add tests/news_export/test_fixture_serving.py integration/news_export/LOCAL_SERVING_LIMITS.md staging-manifest.json\ngit commit -m 'Save reviewed local Werkzeug export serving evidence'\ngit push\nrm .github/workflows/reviewed-batch55.yml\ngit add .github/workflows/reviewed-batch55.yml\ngit commit -m 'Retire batch55 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
