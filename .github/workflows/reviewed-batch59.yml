{
  "name": "Reviewed private increment batch59",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed bounded supplied page watch report",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='dad7c29b328e25f707b6e5a70d0e72c7171d99f908f58e1610145f9f644f41db'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'staging-manifest.json', 'integration/PAGEWATCH_REPORT_LIMITS.md', 'tests/test_pagewatch_report_contract.py', 'integration/pagewatch_report.py', 'integration/FEATURE_STATUS.md', 'integration/page_watch.py', 'README.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/pagewatch_report.py': 'f941eadb45a81cae8cc9096563fe474f21a7e9bf7b1b86a237b54e7e4d1c2626', 'integration/page_watch.py': '8709612dd2424494c6737763853117d599f3eb7a5f8bb9008ba73724174fd0eb', 'integration/PAGEWATCH_REPORT_LIMITS.md': '9fdaa5ddaed815f53b29b59af39e1d37eaa8f28c46fd740fb83e1e04c07e43d3', 'integration/FEATURE_STATUS.md': '933adfca99ca44613247ad71969fd121cbd44ce8c59986fef487a4b8c73551f6', 'README.md': '0023a60d3ba1f8dc63e0d43cdee0ea2871d9920f50c69b09bb66cbe38c4b13ac', 'tests/test_pagewatch_report_contract.py': '1d50be85e535293e543ac69270e222e881506efbf6830d2547f423c7a492d385', 'staging-manifest.json': '4415741538bf0c93d336fda66a6b31c714c0d7d555ba62d8b321641298e604e2'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/pagewatch_report.py integration/page_watch.py integration/PAGEWATCH_REPORT_LIMITS.md integration/FEATURE_STATUS.md README.md tests/test_pagewatch_report_contract.py staging-manifest.json\ngit commit -m 'Save reviewed bounded supplied page watch report'\ngit push\nrm .github/workflows/reviewed-batch59.yml\ngit add .github/workflows/reviewed-batch59.yml\ngit commit -m 'Retire batch59 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
