{
  "name": "Reviewed private increment batch60",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed strict supplied tariff evidence boundary",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='c75c007504cb2ca6c7be19b0606c80f9d28c428bdc7decd43a9636e8fb8b3201'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'tests/test_tariff_evidence_plain.py', 'integration/TARIFF_EVIDENCE_LIMITS.md', 'integration/tariff_evidence.py', 'staging-manifest.json'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/tariff_evidence.py': 'cac8e46fade3005839a6a4f179a11675d35b855bbe11b8712b77e3431454b69c', 'integration/TARIFF_EVIDENCE_LIMITS.md': 'f8ffc5f123be528079985a9eec9c05d206f5ccab7b42ca3b54ebb17c7059ce16', 'tests/test_tariff_evidence_plain.py': '593fba04a064fe669f26161d75dee2c4fdef7ea24e6204056c5732ecd440c329', 'staging-manifest.json': '08c6c23c4f875c751afbef9aedec97b9f0c5f1637d8959eefe48e8e4bbbf0769'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/tariff_evidence.py integration/TARIFF_EVIDENCE_LIMITS.md tests/test_tariff_evidence_plain.py staging-manifest.json\ngit commit -m 'Save reviewed strict supplied tariff evidence boundary'\ngit push\nrm .github/workflows/reviewed-batch60.yml\ngit add .github/workflows/reviewed-batch60.yml\ngit commit -m 'Retire batch60 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
