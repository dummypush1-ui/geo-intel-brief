name: Private loaded news sort and sample export
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='e377af29f214e950ef21426ace7e63b18d927f64e628512cc1efc338767ca97e'\n\
        allowed={'tests/browser_loaded_news.py', 'integration/ui/workspace.js', 'staging-manifest.json',\
        \ 'integration/loaded_news.py', 'tests/test_loaded_news.py', 'integration/ui/workspace.html',\
        \ 'integration/news_api.py'}\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n\
        \    assert set(z.namelist())==allowed and not z.testzip()\n    z.extractall('.')\n\
        PY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/loaded-news-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Add explicit loaded-view sorting and safe sample CSV export''

        git push

        '
