name: Finder held review package
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finder-held-package.yml
  workflow_dispatch:
    inputs:
      revision:
        description: Exact public Finder source commit to review
        required: true
        type: string
        default: "9133270856bb77170956b707bafe260997690d80"
permissions:
  contents: read
concurrency:
  group: finder-held-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'dummypush1-ui/geo-intel-brief'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build exact source-to-review package in runner scratch
        env:
          FINDER_SOURCE_REVISION: ${{ github.event.inputs.revision || '9133270856bb77170956b707bafe260997690d80' }}
          MERGED_FINDER_REFRESH_PREP_ENABLED: "true"
          MERGED_FINDER_RECONCILE_PREP_ENABLED: "true"
          MERGED_FINDER_SOURCE_PREP_ENABLED: "true"
          MERGED_FINDER_REBIND_PREP_ENABLED: "true"
          MERGED_FINDER_SAFE_RENDER_PREP_ENABLED: "true"
          MERGED_FINDER_PACKAGE_PREP_ENABLED: "true"
          MERGED_FINDER_CHAIN_PREP_ENABLED: "true"
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from integration.finder_chain_f7 import prepare

          report, package, manifest = prepare(
              os.environ.copy(),
              revision=os.environ["FINDER_SOURCE_REVISION"],
          )
          if report.get("state") != "held_complete_source_chain_not_runtime_rebound":
              raise SystemExit("Held Finder package was not produced")
          out = Path(os.environ["RUNNER_TEMP"]) / "finder-held-review"
          out.mkdir(mode=0o700)
          (out / "finder-candidate.zip").write_bytes(package)
          (out / "manifest.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          summary = {
              "state": report["state"],
              "sha256": report["sha256"],
              "bytes": report["bytes"],
              "file_count": report["file_count"],
              "baseline": report["baseline"],
              "source_revision": report["source_revision"],
              "source_fetches": report["source_fetches"],
              "retries": report["retries"],
              "ai_calls": report["ai_calls"],
              "writes": report["writes"],
              "published": report["published"],
              "auto_repin": report["auto_repin"],
          }
          (out / "report.json").write_text(
              json.dumps(summary, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Upload held review package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finder-held-review-${{ github.event.inputs.revision || '9133270856bb77170956b707bafe260997690d80' }}
          path: ${{ runner.temp }}/finder-held-review/
          if-no-files-found: error
          retention-days: 7
