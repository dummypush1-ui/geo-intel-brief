name: Private supplied chart and keyword policy adapters
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='26671ee9e01a3eda0204391f5c71684b614de4581f597d5b52b35b9830795dae'\n\
        allowed={'tests/test_loaded_charts.py', 'integration/loaded_charts.py', 'staging-manifest.json'}\n\
        with zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert set(z.namelist())==allowed\
        \ and not z.testzip()\n    z.extractall('.')\nPY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/loaded-chart-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Add supplied UTC sample charts and original keyword policy
        adapter''

        git push

        '
