{
  "name": "Reviewed private increment batch42",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Harden reviewed Finder shortlist CSV cells",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='60f2ca1ce5f9775fda61ca17e86bd8be658eadd41333f49e05603c74486b5515'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/news_api.py', 'integration/finder_nested.py', 'integration/FINDER_NESTED_LIMITS.md', 'staging-manifest.json', 'tests/test_finder_nested.py', 'tests/browser_finder_nested.py'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/finder_nested.py': '8aed1a572e4b8d5d5580194937324bc0f168d1618c5bc3017cf90c23ed7a06d6', 'integration/news_api.py': '66f03e63a0a0bbc0360f39861903231c0d8c3fd2429670d0bf791d2c313df511', 'integration/FINDER_NESTED_LIMITS.md': 'fae0cd7ffdc87848c2b41df262c84ccf4b0a34c8ab8e36b723858b0bd0574f7b', 'tests/test_finder_nested.py': '4a1f8546e7f4831db81977ef766b3a788616f2131683e1ae0c6cf4a4a2f637da', 'tests/browser_finder_nested.py': '63d9f07275328045908339615f48928e0ffcbeed7ce1f612d642a53519367a0e', 'staging-manifest.json': '5e2422519726966a00815ee2fc225ea2f0782b30d43f4a483999daf6abe93089'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/finder_nested.py integration/news_api.py integration/FINDER_NESTED_LIMITS.md tests/test_finder_nested.py tests/browser_finder_nested.py staging-manifest.json\ngit commit -m 'Harden reviewed Finder shortlist CSV cells'\ngit push\nrm .github/workflows/reviewed-batch42.yml\ngit add .github/workflows/reviewed-batch42.yml\ngit commit -m 'Retire batch42 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
