{
  "name": "Reviewed private increment batch73",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed offline increment 73",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'staging-manifest.json', 'integration/country_alerts.py', 'tests/test_country_alerts.py', 'integration/FEATURE_STATUS.md', 'integration/COUNTRY_ALERTS_LIMITS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/country_alerts.py': '4f4a80e651ee97654f8d3592ebc66fe27eb6a386b9724310f568a62675dc9290', 'integration/COUNTRY_ALERTS_LIMITS.md': '08429b42dd73828d442f82a9e797ae1b86d88a0d3196b2fbed0da81a3a5fb2fb', 'tests/test_country_alerts.py': '420b2f6a67a634559b1eab326de1a5d0c9a6c625b651ca4ed5e205a68a429cfe', 'integration/FEATURE_STATUS.md': '2399f7d9514786f29507f2c2143eb68a40c6ced9c861797f48af926af6d84b8f', 'staging-manifest.json': '118bde925614b10cf86d795aeebeb52dd720b25bfe818f16b84da5ff0f3e99c2'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/country_alerts.py integration/COUNTRY_ALERTS_LIMITS.md tests/test_country_alerts.py integration/FEATURE_STATUS.md staging-manifest.json\ngit commit -m 'Save reviewed offline increment 73'\ngit push\nrm .github/workflows/reviewed-batch73.yml\ngit add .github/workflows/reviewed-batch73.yml\ngit commit -m 'Retire batch73 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
