      - name: Full private fixture tests
        run: |
          pip install -r requirements-staging.txt
          python -m unittest discover -s tests -v
          node --input-type=module --check < integration/ui/workspace.js
      - name: Commit backup and retire workflow
        run: |
          rm .github/workflows/connections-increment.yml
          git config user.name 'geo-intel-staging-bot'
          git config user.email 'staging@users.noreply.github.com'
          git add -A
          git commit -m 'Add reviewed private settings, Apps Script contracts and cross-project adapters'
          git push
