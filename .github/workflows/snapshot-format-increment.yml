name: Private snapshot label and path guards
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='156b3c65764bba766139a71cf9b06f1247d540a18880a6efb4c5b7bac97d94d6'\n\
        allowed={'integration/dashboard_snapshots.py', 'tests/browser_dashboard_snapshots.py',\
        \ 'staging-manifest.json', 'tests/test_dashboard_snapshots.py', 'integration/ui/workspace.js'}\n\
        with zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert set(z.namelist())==allowed\
        \ and not z.testzip()\n    z.extractall('.')\nPY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/snapshot-format-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Guard snapshot format labels and raw URL paths''

        git push

        '
