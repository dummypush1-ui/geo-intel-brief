{
  "name": "Reviewed private increment batch74",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed offline increment 74",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/MAP_LAYERS_LIMITS.md', 'tests/test_map_layers.py', 'integration/FEATURE_STATUS.md', 'integration/map_layers.py', 'staging-manifest.json'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/map_layers.py': '57e7fdea3d799baa30b2bfa9771431cef9091bf886b471332ee7364e1f687ded', 'integration/MAP_LAYERS_LIMITS.md': 'bd0ec31e0326b20cc83ca70f30ec46a4b73ff6d93a2f8b15448f405391b09d7a', 'tests/test_map_layers.py': '64833ebac72836e2f4b2e86149863cb19d9883dff20dad61832f6da7a89fe834', 'integration/FEATURE_STATUS.md': '51ed33a77b6a8d31f5f67dcee441b47a5166c8d377a8e077e8430ea08cc9fe9d', 'staging-manifest.json': '297373ab9165b80bd37b085fa9d14c974d884ab56b11990a4a18c0ad83174511'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/map_layers.py integration/MAP_LAYERS_LIMITS.md tests/test_map_layers.py integration/FEATURE_STATUS.md staging-manifest.json\ngit commit -m 'Save reviewed offline increment 74'\ngit push\nrm .github/workflows/reviewed-batch74.yml\ngit add .github/workflows/reviewed-batch74.yml\ngit commit -m 'Retire batch74 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
