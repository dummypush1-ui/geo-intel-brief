name: HSN daily data refresh
on:
  schedule: [{ cron: '30 3 * * *' }]
  workflow_dispatch:
permissions: { contents: write, issues: write, pull-requests: write }
defaults:
  run:
    working-directory: hsn/tools
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: sudo apt-get install -y -q poppler-utils
      - run: node automate.mjs
        env:
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Publish built files into hsn/static
        run: node publish.mjs
      - name: Commit verified data to main
        working-directory: .
        run: |
          git config user.name "hsn-finder-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A -- hsn ':!hsn/tools/state/gst-proposal.json' ':!hsn/tools/offline.html'
          git diff --cached --quiet || (git commit -m "Auto data refresh $(date -u +%F)" && git push)
      - name: Open GST review PR (AI draft, human approves)
        if: hashFiles('hsn/tools/state/gst-proposal.json') != ''
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          B=gst-update-$(date -u +%F-%H%M); git checkout -b $B
          node apply-gst.mjs && rm state/gst-proposal.json && node build.mjs && node publish.mjs
          git add -A -- .. ':!offline.html' && git commit -m "GST rate update (AI-drafted, needs review)" && git push -u origin $B
          gh pr create --title "GST rate update - review needed" --body-file /tmp/pr-body.md
          [ "${{ vars.AUTO_MERGE_GST }}" = "1" ] && gh pr merge --squash || true
