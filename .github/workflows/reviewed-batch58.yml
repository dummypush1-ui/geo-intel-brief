{
  "name": "Reviewed private increment batch58",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed strict page HTML parser budgets",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='d1f9ab32331e28ce25a798fe14e2b95148e77a505fa39689eefd19086f4ae187'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'tests/test_page_watch_parser_budget.py', 'integration/page_watch.py', 'staging-manifest.json', 'integration/PAGE_WATCH_LIMITS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/page_watch.py': '2fb22cf46b766c42dffee15fa5a79bfe343edaff3ddefef87ff69b7f44beffa8', 'integration/PAGE_WATCH_LIMITS.md': 'efd7f956afaaf6eecb9e6a09377c0eb8e9d6dbd7829970db97795909c00c08ee', 'tests/test_page_watch_parser_budget.py': 'dfa8b432358aeda393367b8714cee485b69efbbc2db3aa54577d3d3f18760e84', 'staging-manifest.json': '2bfcd4a7200f2b17e597b67d19f83febb9c86725a559e51ee833b12d8ebd97ae'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/page_watch.py integration/PAGE_WATCH_LIMITS.md tests/test_page_watch_parser_budget.py staging-manifest.json\ngit commit -m 'Save reviewed strict page HTML parser budgets'\ngit push\nrm .github/workflows/reviewed-batch58.yml\ngit add .github/workflows/reviewed-batch58.yml\ngit commit -m 'Retire batch58 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
