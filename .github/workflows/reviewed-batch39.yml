{
  "name": "Reviewed events adapter batch39",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply reviewed offline event reader",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='69ffc0fb7bb9fb642f197426dc15c9acdccbe3f880fd0a2134e5d032f68773d6'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/EVENT_READER_LIMITS.md', 'integration/event_reader.py', 'staging-manifest.json', 'tests/test_event_reader.py'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/event_reader.py': 'fbddedabef6ba54c3b47f70e94511310b69a6b7466f393a40088034e23d526df', 'integration/EVENT_READER_LIMITS.md': 'e643cd0301531bceafc70c07b636dc5babbd76c8de3add449c2f5c6ca1508701', 'tests/test_event_reader.py': 'eb836c397f588fcc1bef92d8fc28143c90f65eae7885607bc55782878243f505', 'staging-manifest.json': 'a4d0442526adee0e161b3fb1f6a42f80f1ea370ed1e617481aff72361a6ee6b9'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/event_reader.py integration/EVENT_READER_LIMITS.md tests/test_event_reader.py staging-manifest.json\ngit commit -m 'Add reviewed read-only events adapter'\ngit push\nrm .github/workflows/reviewed-batch39.yml\ngit add .github/workflows/reviewed-batch39.yml\ngit commit -m 'Retire batch39 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
