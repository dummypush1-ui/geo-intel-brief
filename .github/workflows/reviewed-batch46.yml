{
  "name": "Reviewed private increment batch46",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed original-order keyset query plan",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='473d7e7009526b0bdb5f87a984dffdd9e8b4bb4be4f2b9f79804138937fe6099'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'tests/news_export/test_keyset_plan.py', 'staging-manifest.json', 'integration/news_export/keyset_plan.py', 'integration/news_export/KEYSET_LIMITS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/news_export/keyset_plan.py': '516120452e7eacde7daec0a727a19c6803b4d0f3554990ee863761d6368174ca', 'integration/news_export/KEYSET_LIMITS.md': '75a195012a6a3a394e21058b935c61f84940b85e3e4c47f0d8abb918a6902448', 'tests/news_export/test_keyset_plan.py': '2487e1b3625a470a56b0c15820cba10ffcf99664b5a585fccfc27fb745c38ac8', 'staging-manifest.json': 'bf52e98bcebace50d3e073dac25c5006285b2c659c2590843682bfa706a4cd2a'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/news_export/keyset_plan.py integration/news_export/KEYSET_LIMITS.md tests/news_export/test_keyset_plan.py staging-manifest.json\ngit commit -m 'Save reviewed original-order keyset query plan'\ngit push\nrm .github/workflows/reviewed-batch46.yml\ngit add .github/workflows/reviewed-batch46.yml\ngit commit -m 'Retire batch46 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
