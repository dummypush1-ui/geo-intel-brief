name: Private in-memory writer contract
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='620d9326561062d53c3d9bb94057f5cc41c9da76b70f35749a2afce713919dab'\n\
        allowed={'tests/test_fake_collection_writer.py', 'staging-manifest.json',\
        \ 'integration/fake_collection_writer.py', 'integration/FAKE_WRITER_LIMITS.md'}\n\
        with zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert set(z.namelist())==allowed\
        \ and not z.testzip()\n    z.extractall('.')\nPY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/fake-writer-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Add in-memory project writer contract and limitations''

        git push

        '
