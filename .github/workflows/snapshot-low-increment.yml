name: Private snapshot URL and display cleanup
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='7f7708ea790b982d11a7910726773b3aba9b164684a118d4c5d0b9c9b10714df'\n\
        allowed={'tests/test_dashboard_snapshots.py', 'integration/ui/workspace.js',\
        \ 'integration/dashboard_snapshots.py', 'staging-manifest.json', 'tests/browser_dashboard_snapshots.py'}\n\
        with zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert set(z.namelist())==allowed\
        \ and not z.testzip()\n    z.extractall('.')\nPY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/snapshot-low-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Normalize snapshot links and distinguish unavailable states''

        git push

        '
