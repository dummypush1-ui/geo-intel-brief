{
  "name": "Private reviewed tariff evidence",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply reviewed tariff evidence",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='0eda0dde58497c3736aa9b17ce3a399d0439abb6e6af16e3ea6970c80e047922'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n assert set(z.namelist())=={'integration/ui/countries.html', 'integration/ui/countries.js', 'tests/test_tariff_evidence.py', 'tests/browser_tariff_evidence.py', 'integration/TARIFF_EVIDENCE_LIMITS.md', 'integration/ui/tariffs.js', 'integration/tariff_evidence.py', 'integration/news_api.py', 'staging-manifest.json', 'integration/ui/tariffs.html'} and not z.testzip()\n z.extractall('.')\nPY\ngit add integration/tariff_evidence.py integration/TARIFF_EVIDENCE_LIMITS.md integration/news_api.py integration/ui/tariffs.html integration/ui/tariffs.js integration/ui/countries.html integration/ui/countries.js tests/test_tariff_evidence.py tests/browser_tariff_evidence.py staging-manifest.json\ngit commit -m 'Add private tariff-document evidence and explicit HSN reasons'\ngit push\nrm .github/workflows/reviewed-tariff-evidence.yml\ngit add .github/workflows/reviewed-tariff-evidence.yml\ngit commit -m 'Retire tariff-evidence backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
