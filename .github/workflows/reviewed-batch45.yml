{
  "name": "Reviewed private increment batch45",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Wire reviewed default-off Geo-only preview launcher",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='dee0be59f4546e6c93e9228524c139c2f96f2ae5ca80f1c35d24285d0d0c4a8d'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/PREVIEW_LAUNCHER_LIMITS.md', 'integration/preview_launcher.py', 'tests/test_preview_launcher.py', 'integration/private_router.py', 'integration/FINDER_PARITY_PLAN.md', '.env.example', 'integration/EXPORT_DIGEST_LIMITS.md', 'staging-manifest.json'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/preview_launcher.py': 'a9d7a58fb7723a2154fac0ac5ecdd42a79a6ab221bbb86581d9ca033954e4bf9', 'integration/private_router.py': '61b4b22a12a3d3a20e9ab89f3f8d7f501e78021f9c0e547daf4125c25c0ec037', 'integration/PREVIEW_LAUNCHER_LIMITS.md': 'd9b22cbef544337d9b0f1d9b4f0635fa068a994a1d58a0e94e71344fa7d586d4', 'tests/test_preview_launcher.py': '9020d077b00f79b736d28f03569a21506d086088cbe2cbd4fcc241c365107dd0', '.env.example': '65c87aeee0110e691f502e0a6ced2b435da43624c9fc3ec5335cebfae7b4302a', 'integration/FINDER_PARITY_PLAN.md': '45c11691c29ed391f7388b77b711df0ab0884e43128825c0b083994593f33633', 'integration/EXPORT_DIGEST_LIMITS.md': '7d10815568f25a85637609faaec5dc5f1b7fa5a03e8634a5f6d26400b5fa39db', 'staging-manifest.json': '37d342e454e02811eb8c041ebeb3069a697fb16f74ad75433cf4c358dc63e9be'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/preview_launcher.py integration/private_router.py integration/PREVIEW_LAUNCHER_LIMITS.md tests/test_preview_launcher.py .env.example integration/FINDER_PARITY_PLAN.md integration/EXPORT_DIGEST_LIMITS.md staging-manifest.json\ngit commit -m 'Wire reviewed default-off Geo-only preview launcher'\ngit push\nrm .github/workflows/reviewed-batch45.yml\ngit add .github/workflows/reviewed-batch45.yml\ngit commit -m 'Retire batch45 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
