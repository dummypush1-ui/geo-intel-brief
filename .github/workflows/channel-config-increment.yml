name: Private configured channel mapping
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='fae84bab30572f409c5f4016c09a86811fd9575a69a7613b1c4ea5711e99a689'\n\
        allowed={'integration/youtube_links.py', 'integration/original_dashboard_payloads.py',\
        \ 'staging-manifest.json', 'tests/test_youtube_links.py'}\nwith zipfile.ZipFile(io.BytesIO(data))\
        \ as z:\n    assert set(z.namelist())==allowed and not z.testzip()\n    z.extractall('.')\n\
        PY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/channel-config-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Preserve supplied configured channel links''

        git push

        '
