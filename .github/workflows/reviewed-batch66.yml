{
  "name": "Reviewed private increment batch66",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed offline stream file CAS",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/STREAM_DISK_LIMITS.md', 'tests/test_stream_disk.py', 'integration/stream_disk.py', 'staging-manifest.json'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/stream_disk.py': 'ecca84c39e56c96c67edde8f067f8a439dfe0d0332378823a2607bc6fdae79f8', 'integration/STREAM_DISK_LIMITS.md': '5ce37a8701a04fb68e533af1137d0dfba393a6d5a89f42c3aeb551cc1002f875', 'tests/test_stream_disk.py': '82247bc90f6eff4df4f371b1d2a00251d862c346c621a1d6eb3442c9fa7637a0', 'staging-manifest.json': 'e094d63aff7fa3dc09571524a6e7532a0e3a1b945dbf3b54607369f25b0635f7'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/stream_disk.py integration/STREAM_DISK_LIMITS.md tests/test_stream_disk.py staging-manifest.json\ngit commit -m 'Save reviewed local stream config CAS'\ngit push\nrm .github/workflows/reviewed-batch66.yml\ngit add .github/workflows/reviewed-batch66.yml\ngit commit -m 'Retire batch66 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
