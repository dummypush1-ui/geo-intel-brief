{
  "name": "Reviewed private increment batch68",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed offline parity status",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,io,zipfile,hashlib\nfrom pathlib import Path\nb=base64.b64decode('')\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'staging-manifest.json', 'integration/SINGLE_DB_PLAN_LIMITS.md', 'README.md', 'integration/FEATURE_STATUS.md', 'integration/EVENT_READER_LIMITS.md'} and not z.testzip()\n z.extractall('.')\nexpected={'README.md': 'a5632ccd20d0322a61526c3e277aabaeaabdcd9c13b52fc8cfdca3dc78462063', 'integration/FEATURE_STATUS.md': 'b3dfc1f10e7b29428d80e907eb1cd1f3b9b1f0b360e66fac81a576865a4cabb3', 'integration/SINGLE_DB_PLAN_LIMITS.md': '59f843ef877dd8cafc0613c1184024b21df692de01b6990d5cca6d232f080ddb', 'integration/EVENT_READER_LIMITS.md': 'a834549638b2a31765a5781655b041c722188e5a62e0d4c7228de881b04df2a7', 'staging-manifest.json': 'abcad8e777bfd42743517b9c7770a4979e3fc43cf14d54966311339bbe045b4d'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add README.md integration/FEATURE_STATUS.md integration/SINGLE_DB_PLAN_LIMITS.md integration/EVENT_READER_LIMITS.md staging-manifest.json\ngit commit -m 'Save final offline parity evidence and current feature status'\ngit push\nrm .github/workflows/reviewed-batch68.yml\ngit add .github/workflows/reviewed-batch68.yml\ngit commit -m 'Retire batch68 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
