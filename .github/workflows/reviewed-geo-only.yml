{
  "name": "Private reviewed Geo-only composition",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Apply reviewed Geo-only composition",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\nassert hashlib.sha256(data).hexdigest()=='1864fb58ab21e6cf0a2680d5d73bb853acb09593fbd227f033fa3413b6eb76e2'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n assert set(z.namelist())=={'integration/GEO_ONLY_LIMITS.md', 'tests/test_geo_only_runtime.py', 'integration/geo_only_runtime.py', 'staging-manifest.json'} and not z.testzip()\n z.extractall('.')\nPY\ngit add integration/geo_only_runtime.py integration/GEO_ONLY_LIMITS.md tests/test_geo_only_runtime.py staging-manifest.json\ngit commit -m 'Add explicit Geo-only private read composition'\ngit push\nrm .github/workflows/reviewed-geo-only.yml\ngit add .github/workflows/reviewed-geo-only.yml\ngit commit -m 'Retire Geo-only backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
