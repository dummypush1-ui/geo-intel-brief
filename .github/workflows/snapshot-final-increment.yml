name: Private final snapshot display guards
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Verify scoped payload
      run: "python3 - <<'PY'\nimport base64,hashlib,zipfile,io\ndata=base64.b64decode('')\n\
        assert hashlib.sha256(data).hexdigest()=='f001b7b450f13212e6c2e5796dbe9928f8098bf2e490f9d573ceaa3fee0a1978'\n\
        allowed={'tests/browser_dashboard_snapshots.py', 'staging-manifest.json',\
        \ 'integration/ui/workspace.js', 'tests/test_dashboard_snapshots.py', 'integration/dashboard_snapshots.py'}\n\
        with zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert set(z.namelist())==allowed\
        \ and not z.testzip()\n    z.extractall('.')\nPY\n"
    - name: Commit private backup and retire workflow
      run: 'rm .github/workflows/snapshot-final-increment.yml

        git config user.name ''geo-intel-staging-bot''

        git config user.email ''staging@users.noreply.github.com''

        git add -A

        git commit -m ''Finish snapshot display validation and document limitations''

        git push

        '
