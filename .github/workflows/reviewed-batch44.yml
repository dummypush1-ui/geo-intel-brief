{
  "name": "Reviewed private increment batch44",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Compose reviewed original stream snapshot fixture",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='4f5af5d4395582c932abaaf79ea0121c0117ec618df7e4c34f4c9f62212d2206'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/stream_config.py', 'integration/BRICS_STREAM_LIMITS.md', 'integration/ui/brics_streams.css', 'integration/stream_fixture_app.py', 'tests/test_stream_fixture_app.py', 'tests/browser_stream_config.py', 'staging-manifest.json', 'integration/ui/brics_streams.html'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/stream_fixture_app.py': 'cb522d927bfb1207170f96cb9a532288f724a7602d50cabbea13c22709db44df', 'integration/stream_config.py': '2777adce27f068766a9af6ed00d9460c827ed1baf28ff00bc33aed7033e31755', 'integration/BRICS_STREAM_LIMITS.md': '61cebc64f4326d9d21772104280b8656a4ac2fd8b340601fe4297a099efc7ac9', 'integration/ui/brics_streams.html': '6a83febfb08d4e2c45870e49e843fd2a28ec2aa8ac2260d38eeecabd0117befc', 'integration/ui/brics_streams.css': 'a46602045ec03005dd1a6f4146af8cd656b0811664ead261bc4f4c0304842a85', 'tests/test_stream_fixture_app.py': '905aaa33e8b4cef331e97ec72baadac0f7b02be77cfeb0be8519e266e34fe6b2', 'tests/browser_stream_config.py': 'ba301e706542eef1d2f4a0e89e4a716c95d0a53e3cc79345d9c541b70da6c081', 'staging-manifest.json': '9ce5c698655771b63d838ffc3be58ae16799d6d36ae2093a15f1bd31d85474c6'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/stream_fixture_app.py integration/stream_config.py integration/BRICS_STREAM_LIMITS.md integration/ui/brics_streams.html integration/ui/brics_streams.css tests/test_stream_fixture_app.py tests/browser_stream_config.py staging-manifest.json\ngit commit -m 'Compose reviewed original stream snapshot fixture'\ngit push\nrm .github/workflows/reviewed-batch44.yml\ngit add .github/workflows/reviewed-batch44.yml\ngit commit -m 'Retire batch44 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
