{
  "name": "Reviewed private increment batch54",
  "on": {
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "reviewed-private-backup",
    "cancel-in-progress": false
  },
  "jobs": {
    "apply": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Save reviewed single instance account conformance and limiter lifecycle",
          "run": "git config user.name 'geo-intel-staging-bot'\ngit config user.email 'staging@users.noreply.github.com'\npython3 - <<'PY'\nimport hashlib,base64,zipfile,io\nfrom pathlib import Path\nb=base64.b64decode('')\nassert hashlib.sha256(b).hexdigest()=='acdd0a7dc28ebe08a5f444a138c33e1d19369b948b47776fc7a1ada06cd99045'\nwith zipfile.ZipFile(io.BytesIO(b)) as z:\n assert set(z.namelist())=={'integration/accounts/limiter.py', 'tests/accounts/test_store_conformance.py', 'integration/accounts/CONFORMANCE_LIMITS.md', 'tests/accounts/test_reservation_terminal.py', 'integration/accounts/service.py', 'staging-manifest.json'} and not z.testzip()\n z.extractall('.')\nexpected={'integration/accounts/limiter.py': '816112e2b31c0864ca9493b9ccece1096b93d6c25918631250e238b12ec2a565', 'integration/accounts/service.py': '9c54cf9b76f0c691635da6a43d868ebc52c9ff115cadd6726592605c8fa8239f', 'integration/accounts/CONFORMANCE_LIMITS.md': '5a6351b5f5e4ceed59aa9791676a9c0a35e24a00e0add0053bd4960bcba113f1', 'tests/accounts/test_reservation_terminal.py': 'ef47ec262e461b0373be3cc90c08e92f6f195029ee401e47c4f2ed8d24170812', 'tests/accounts/test_store_conformance.py': '3a46fd4738f2eb8a46edceea2bcd208eea6fdf9f4d9263aa949f87095325d541', 'staging-manifest.json': '33265076f585d8c2980a3d2cf701b1592f99f2c65b0ba9401850f9fc28f91763'}\nfor p,h in expected.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p\nPY\ngit add integration/accounts/limiter.py integration/accounts/service.py integration/accounts/CONFORMANCE_LIMITS.md tests/accounts/test_reservation_terminal.py tests/accounts/test_store_conformance.py staging-manifest.json\ngit commit -m 'Save reviewed single instance account conformance and limiter lifecycle'\ngit push\nrm .github/workflows/reviewed-batch54.yml\ngit add .github/workflows/reviewed-batch54.yml\ngit commit -m 'Retire batch54 backup workflow'\ngit push\n"
        }
      ]
    }
  }
}
